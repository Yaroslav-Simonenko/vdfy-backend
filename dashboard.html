<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VDFY Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --bg: #f3f4f6; --surface: #ffffff; --border: #e5e7eb; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; }
        .main { flex-grow: 1; padding: 40px; overflow-y: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; border: 1px solid var(--border); overflow: hidden; padding: 15px; }
        video { width: 100%; border-radius: 8px; background: #000; }
        .btn { padding: 8px 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; margin-top: 10px; }
        .btn-p { background: var(--primary); color: white; width: 100%; }
        .folder { background: white; padding: 20px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid var(--border); }
        .hidden { display: none !important; }
        .view-section { display: none; }
        .view-section.active { display: block; }
    </style>
</head>
<body>
    <div id="login-screen" style="position:fixed;inset:0;background:white;z-index:99;display:flex;align-items:center;justify-content:center;">
        <button id="login-btn" class="btn btn-p" style="width:200px">Login with Google</button>
    </div>

    <div class="sidebar">
        <h2>🎥 VDFY</h2>
        <div id="user-email" style="font-size:12px; margin-bottom:20px; color:gray;"></div>
        <div class="btn" onclick="switchTab('videos')">📁 Recordings</div>
        <div class="btn" onclick="switchTab('analytics')">📊 AI Analytics</div>
        <div style="flex-grow:1"></div>
        <div class="btn" id="logout-btn" style="color:red">Sign Out</div>
    </div>

    <div class="main">
        <h1 id="page-title">My Folders</h1>
        <div id="folder-nav" class="hidden" onclick="renderFolders()" style="cursor:pointer;margin-bottom:20px;color:blue;">⬅ Back</div>

        <div id="tab-videos" class="view-section active">
            <div id="folders-container" class="grid"></div>
            <div id="videos-container" class="grid hidden"></div>
        </div>

        <div id="tab-analytics" class="view-section">
            <div style="background:white;padding:20px;border-radius:12px;border:1px solid var(--border);">
                <h3>🤖 AI Result</h3>
                <p id="ai-content">Click 'Analyze' on a video to see results here.</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
    apiKey: "AIzaSyDBUbYLkuMMQaKHomNursjJ1zoFNtIZjy4",
    authDomain: "vdfy-auth-system.firebaseapp.com",
    projectId: "vdfy-auth-system",
    storageBucket: "vdfy-auth-system.firebasestorage.app",
    messagingSenderId: "381929137400",
    appId: "1:381929137400:web:661c3b07907e639fa5070d"
  };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        let groupedData = {};

        onAuthStateChanged(auth, user => {
            if (user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('user-email').innerText = user.email;
                loadVideos();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
            }
        });

        document.getElementById('login-btn').onclick = () => signInWithPopup(auth, new GoogleAuthProvider());
        document.getElementById('logout-btn').onclick = () => signOut(auth);

        async function loadVideos() {
            const token = await auth.currentUser.getIdToken();
            const res = await fetch('/api/my-videos', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            
            groupedData = {};
            data.videos.forEach(v => {
                const f = v.formName || "General";
                if (!groupedData[f]) groupedData[f] = [];
                groupedData[f].push(v);
            });
            renderFolders();
        }

        window.renderFolders = () => {
            const container = document.getElementById('folders-container');
            container.innerHTML = "";
            document.getElementById('videos-container').classList.add('hidden');
            container.classList.remove('hidden');
            document.getElementById('folder-nav').classList.add('hidden');
            
            Object.keys(groupedData).forEach(name => {
                container.innerHTML += `<div class="folder" onclick="openFolder('${name}')">📁 <h3>${name}</h3><p>${groupedData[name].length} videos</p></div>`;
            });
        };

        window.openFolder = (name) => {
            const container = document.getElementById('videos-container');
            container.innerHTML = "";
            document.getElementById('folders-container').classList.add('hidden');
            container.classList.remove('hidden');
            document.getElementById('folder-nav').classList.remove('hidden');

            groupedData[name].forEach(v => {
                container.innerHTML += `
                    <div class="card">
                        <video controls src="${v.url}"></video>
                        <button class="btn" onclick="viewText('${v.textUrl}')">📄 Text</button>
                        <button class="btn btn-p" onclick="analyzeAI('${v.textUrl}', this)">🤖 Analyze</button>
                        <button class="btn" style="color:red" onclick="deleteVideo('${v.key}')">🗑</button>
                    </div>`;
            });
        };

        window.viewText = async (url) => {
            const res = await fetch(url);
            alert(await res.text());
        };

        window.analyzeAI = async (textUrl, btn) => {
            btn.innerText = "Analyzing...";
            const token = await auth.currentUser.getIdToken();
            const res = await fetch('/api/analyze-text', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ textUrl })
            });
            const data = await res.json();
            document.getElementById('ai-content').innerText = data.analysis;
            switchTab('analytics');
            btn.innerText = "🤖 Analyze";
        };

        window.switchTab = (tab) => {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
        };

        window.deleteVideo = async (videoKey) => {
            if (!confirm("Delete?")) return;
            const token = await auth.currentUser.getIdToken();
            await fetch('/api/delete-video', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ videoKey })
            });
            loadVideos();
        };
    </script>
</body>
</html>
