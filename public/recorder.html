<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VDFY Recorder</title>
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.0/dist/ffmpeg.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f3f4f6; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); text-align: center; width: 90%; max-width: 420px; }
        h1 { margin: 0 0 10px; font-size: 20px; color: #111827; }
        p { color: #6b7280; font-size: 14px; margin-bottom: 20px; }
        
        video { width: 100%; border-radius: 8px; background: #000; display: none; margin-bottom: 15px; transform: scaleX(-1); }
        
        .btn { padding: 12px 24px; border: none; border-radius: 6px; font-size: 16px; font-weight: 500; cursor: pointer; transition: background 0.2s; width: 100%; margin-top: 10px; }
        .btn-primary { background-color: #2563eb; color: white; }
        .btn-primary:hover { background-color: #1d4ed8; }
        .btn-danger { background-color: #ef4444; color: white; display: none; }
        .btn-success { background-color: #10b981; color: white; display: none; }
        
        /* Кнопка закриття */
        .btn-close { background-color: #fee2e2; color: #991b1b; margin-top: 15px; }
        .btn-close:hover { background-color: #fecaca; }

        .status { margin-top: 15px; font-size: 14px; color: #4b5563; min-height: 20px; }
        
        /* Success Screen */
        #success-screen { display: none; }
        .link-box { display: flex; gap: 8px; margin-top: 15px; }
        input[type="text"] { flex: 1; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; }
        .copy-btn { background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; }
        .copy-btn:hover { background: #059669; }

        .confetti { font-size: 40px; display: block; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container" id="recorder-screen">
        <h1 id="form-title">📹 Video Response</h1>
        <p>Click below to start recording your answer.</p>
        
        <video id="preview" autoplay muted playsinline></video>
        
        <button id="start-btn" class="btn btn-primary">Start Recording</button>
        <button id="stop-btn" class="btn btn-danger">Stop Recording</button>
        <button id="upload-btn" class="btn btn-success">Upload Answer</button>

        <div class="status" id="status-text">Ready</div>
    </div>

    <div class="container" id="success-screen">
        <span class="confetti">🎉</span>
        <h1>Upload Complete!</h1>
        <p>Copy the link below and paste it into the Google Form.</p>
        
        <div class="link-box">
            <input type="text" id="result-link" readonly>
            <button class="copy-btn" onclick="copyLink()">Copy</button>
        </div>

        <button class="btn btn-close" onclick="window.close()">❌ Close Window</button>
    </div>

    <div style="margin-top: 20px; font-size: 12px; color: #9ca3af;">
        <a href="/privacy.html" target="_blank" style="color: #9ca3af; text-decoration: underline;">Privacy Policy</a>
    </div>

    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;
        const ffmpeg = createFFmpeg({ log: true });
        
        let mediaRecorder;
        let recordedChunks = [];
        const preview = document.getElementById('preview');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const uploadBtn = document.getElementById('upload-btn');
        const statusText = document.getElementById('status-text');
        
        // Отримуємо параметри з URL (хеш або query)
        function getParams() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const id = params.get('id');
            if (id) return { id };
            
            // Fallback для старих посилань
            const pathParts = window.location.pathname.split('/');
            if (pathParts[1] === 'r' && pathParts[2]) return { id: pathParts[2] };
            
            return { id: null };
        }

        const { id } = getParams();

        // 1. Отримуємо інформацію про лінк (email власника)
        async function fetchLinkInfo() {
            if (!id) return null;
            try {
                const res = await fetch(`/api/link-info/${id}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.formName) document.getElementById('form-title').innerText = `📹 ${data.formName}`;
                    return data;
                }
            } catch (e) { console.error(e); }
            return null;
        }

        let linkInfo = null;
        fetchLinkInfo().then(info => linkInfo = info);

        // 2. Ініціалізація камери
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                preview.srcObject = stream;
                preview.style.display = 'block';
                
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) recordedChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    statusText.innerText = "Recording finished. Ready to upload.";
                    startBtn.style.display = 'none';
                    stopBtn.style.display = 'none';
                    uploadBtn.style.display = 'block';
                    
                    uploadBtn.onclick = () => processAndUpload(blob);
                };
            } catch (e) {
                statusText.innerText = "Error: Camera access denied.";
                statusText.style.color = "red";
            }
        }

        startBtn.onclick = () => {
            recordedChunks = [];
            mediaRecorder.start();
            startBtn.style.display = 'none';
            stopBtn.style.display = 'block';
            statusText.innerText = "🔴 Recording...";
            statusText.style.color = "red";
        };

        stopBtn.onclick = () => {
            mediaRecorder.stop();
            preview.srcObject.getTracks().forEach(track => track.stop()); // Вимикаємо камеру
        };

        async function processAndUpload(blob) {
            statusText.innerText = "⏳ Compressing video... (Please wait)";
            statusText.style.color = "#2563eb";
            uploadBtn.disabled = true;

            try {
                if (!ffmpeg.isLoaded()) await ffmpeg.load();
                
                ffmpeg.FS('writeFile', 'input.webm', await fetchFile(blob));
                await ffmpeg.run('-i', 'input.webm', '-c:v', 'libx264', '-crf', '28', '-preset', 'ultrafast', 'output.mp4');
                const data = ffmpeg.FS('readFile', 'output.mp4');
                
                const mp4Blob = new Blob([data.buffer], { type: 'video/mp4' });
                uploadVideo(mp4Blob);
            } catch (e) {
                console.error(e);
                statusText.innerText = "Compression failed. Uploading raw file...";
                uploadVideo(blob); // Fallback
            }
        }

        async function uploadVideo(blob) {
            statusText.innerText = "🚀 Uploading...";
            const formData = new FormData();
            formData.append('file', blob, 'video.mp4');
            
            // Додаємо метадані
            if (linkInfo) {
                formData.append('folder', linkInfo.email); // Email власника форми
                formData.append('subfolder', linkInfo.formName); // Назва форми
            } else {
                formData.append('folder', 'public');
            }

            try {
                const res = await fetch('/api/upload-with-ai', { method: 'POST', body: formData });
                const data = await res.json();
                
                if (data.publicUrl) {
                    showSuccess(data.publicUrl);
                } else {
                    throw new Error("Upload failed");
                }
            } catch (e) {
                statusText.innerText = "Error uploading video.";
                statusText.style.color = "red";
                uploadBtn.disabled = false;
            }
        }

        function showSuccess(url) {
            document.getElementById('recorder-screen').style.display = 'none';
            document.getElementById('success-screen').style.display = 'block';
            document.getElementById('result-link').value = url;
        }

        window.copyLink = function() {
            const copyText = document.getElementById("result-link");
            copyText.select();
            document.execCommand("copy");
            
            const btn = document.querySelector('.copy-btn');
            btn.innerText = "Copied!";
            btn.style.background = "#059669";
            setTimeout(() => {
                btn.innerText = "Copy";
                btn.style.background = "#10b981";
            }, 2000);
        }

        initCamera();
    </script>
</body>
</html>
