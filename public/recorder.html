<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <base href="/"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VDFY Recorder Pro</title>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366F1; --danger: #ef4444; --bg: #F3F4F6; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; box-sizing: border-box; }
        .container { width: 100%; max-width: 600px; background: white; padding: 24px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: none; flex-direction: column; gap: 16px; }
        .media-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .timer { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: white; padding: 4px 12px; border-radius: 20px; font-weight: 600; }
        .controls { display: flex; justify-content: center; gap: 15px; }
        button { padding: 12px 24px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-rec { background: var(--danger); color: white; }
        .btn-send { background: var(--primary); color: white; width: 100%; }
        #loader { text-align: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #ddd; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <p id="loader-text">Ініціалізація камери та AI-модулів...</p>
</div>

<div class="container" id="app">
    <header style="text-align: center;">
        <h2 id="formName">Запис відповіді</h2>
        <p style="color: gray; font-size: 14px;">Ваше відео буде стиснуто для швидкої відправки</p>
    </header>

    <div class="media-wrapper">
        <div class="timer" id="timer">00:00</div>
        <video id="preview" autoplay muted playsinline></video>
    </div>

    <div id="controls-init" class="controls">
        <button class="btn-rec" onclick="startRec()">● Почати запис</button>
    </div>

    <div id="controls-active" class="controls hidden">
        <button style="background:#374151; color:white;" onclick="stopRec()">⏹ Зупинити</button>
    </div>

    <div id="controls-review" class="hidden">
        <button class="btn-send" id="sendBtn" onclick="processAndUpload()">🚀 Відправити відповідь</button>
        <button style="width:100%; margin-top:10px; background:#eee;" onclick="location.reload()">🔄 Перезаписати</button>
    </div>
    
    <div id="status" style="text-align:center; font-size:14px; margin-top:10px; color: var(--primary); font-weight: 500;"></div>
</div>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({ log: true });
    
    let stream, recorder, chunks = [], seconds = 0, timerInterval;
    let targetEmail = "", formTitle = "";

    async function init() {
        const id = window.location.pathname.split('/').pop();
        try {
            // Завантажуємо дані посилання
            const res = await fetch(`/api/link-info/${id}`);
            const data = await res.json();
            targetEmail = data.email;
            formTitle = data.formName;
            document.getElementById('formName').innerText = formTitle;

            // Завантажуємо FFmpeg в браузер (найважча частина)
            document.getElementById('loader-text').innerText = "Завантаження ядра оптимізації (30MB)...";
            if (!ffmpeg.isLoaded()) await ffmpeg.load();

            // Запуск камери
            stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('preview').srcObject = stream;
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('app').style.display = 'flex';
        } catch (e) {
            document.getElementById('loader-text').innerText = "❌ Помилка доступу або недійсне посилання";
        }
    }

    function startRec() {
        recorder = new MediaRecorder(stream);
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.start();
        document.getElementById('controls-init').classList.add('hidden');
        document.getElementById('controls-active').classList.remove('hidden');
        timerInterval = setInterval(() => {
            seconds++;
            document.getElementById('timer').innerText = new Date(seconds * 1000).toISOString().substr(14, 5);
        }, 1000);
    }

    function stopRec() {
        recorder.stop();
        clearInterval(timerInterval);
        document.getElementById('controls-active').classList.add('hidden');
        document.getElementById('controls-review').classList.remove('hidden');
        
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            document.getElementById('preview').srcObject = null;
            document.getElementById('preview').src = URL.createObjectURL(blob);
            document.getElementById('preview').muted = false;
            document.getElementById('preview').controls = true;
        };
    }

    async function processAndUpload() {
        const btn = document.getElementById('sendBtn');
        const status = document.getElementById('status');
        btn.disabled = true;
        
        try {
            status.innerText = "⏳ Оптимізація відео (стискаємо файл)...";
            
            const webmBlob = new Blob(chunks, { type: 'video/webm' });
            const inputName = 'input.webm';
            const outputName = 'output.mp4';

            // Пишемо файл у віртуальну файлову систему FFmpeg
            ffmpeg.FS('writeFile', inputName, await fetchFile(webmBlob));

            // Запускаємо стиснення: libx264, якість 28 (гарний баланс), дуже швидкий пресет
            await ffmpeg.run('-i', inputName, '-vcodec', 'libx264', '-crf', '28', '-preset', 'ultrafast', outputName);

            // Читаємо результат
            const compressedData = ffmpeg.FS('readFile', outputName);
            const mp4Blob = new Blob([compressedData.buffer], { type: 'video/mp4' });

            status.innerText = "🚀 Відправка на сервер...";

            const fd = new FormData();
            fd.append('file', mp4Blob, `rec_${Date.now()}.mp4`);
            fd.append('folder', targetEmail);
            fd.append('subfolder', formTitle);

            const uploadRes = await fetch('/api/upload-with-ai', { method: 'POST', body: fd });
            if (!uploadRes.ok) throw new Error("Помилка сервера");

            status.innerText = "✅ Відео успішно відправлено!";
            document.getElementById('controls-review').classList.add('hidden');
            
        } catch (e) {
            console.error(e);
            status.innerText = "❌ Помилка: " + e.message;
            btn.disabled = false;
            btn.innerText = "Спробувати ще раз";
        }
    }

    init();
</script>
</body>
</html>
