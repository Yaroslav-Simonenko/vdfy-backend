<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VDFY Recorder</title>
    <style>
        body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background: #f3f4f6; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
        video { width: 100%; border-radius: 12px; background: #000; margin-bottom: 20px; }
        .btn { padding: 15px 30px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-r { background: #ef4444; color: white; }
        .btn-p { background: #6366F1; color: white; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="title">Loading...</h2>
        <video id="preview" autoplay muted playsinline></video>
        <div id="timer">00:00</div>
        
        <button id="start-btn" class="btn btn-r" onclick="start()">● Start Recording</button>
        <button id="stop-btn" class="btn hidden" style="background:#374151; color:white;" onclick="stop()">⏹ Stop</button>
        <button id="upload-btn" class="btn btn-p hidden" onclick="upload()">🚀 Send Response</button>
    </div>

    <script>
        let stream, recorder, chunks = [], seconds = 0, timer, targetEmail, formName;

        async function init() {
            const id = window.location.pathname.split('/').pop();
            const res = await fetch(`/api/link-info/${id}`);
            const data = await res.json();
            targetEmail = data.email;
            formName = data.formName;
            document.getElementById('title').innerText = formName;
            stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('preview').srcObject = stream;
        }

        async function start() {
            recorder = new MediaRecorder(stream);
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                document.getElementById('preview').srcObject = null;
                document.getElementById('preview').src = URL.createObjectURL(blob);
                document.getElementById('preview').muted = false;
                document.getElementById('preview').controls = true;
            };
            recorder.start();
            document.getElementById('start-btn').classList.add('hidden');
            document.getElementById('stop-btn').classList.remove('hidden');
            timer = setInterval(() => { seconds++; document.getElementById('timer').innerText = new Date(seconds * 1000).toISOString().substr(14, 5); }, 1000);
        }

        function stop() {
            recorder.stop();
            clearInterval(timer);
            document.getElementById('stop-btn').classList.add('hidden');
            document.getElementById('upload-btn').classList.remove('hidden');
        }

        async function upload() {
            const btn = document.getElementById('upload-btn');
            btn.innerText = "Uploading..."; btn.disabled = true;
            const fd = new FormData();
            fd.append('file', new Blob(chunks, { type: 'video/webm' }), 'vid.webm');
            fd.append('folder', targetEmail);
            fd.append('subfolder', formName);
            await fetch('/api/upload-with-ai', { method: 'POST', body: fd });
            alert("Success!");
            location.reload();
        }

        init();
    </script>
</body>
</html>
