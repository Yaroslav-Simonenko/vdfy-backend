<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <base href="/"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VDFY Recorder</title>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366F1; --danger: #ef4444; --bg: #F3F4F6; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; box-sizing: border-box; }
        
        /* СТАРИЙ ДИЗАЙН КАРТКИ */
        .container { 
            width: 100%; max-width: 500px; background: white; 
            padding: 30px; border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            display: none; flex-direction: column; gap: 20px; text-align: center;
        }

        h2 { margin: 0 0 5px 0; color: #111827; }
        p { margin: 0; color: #6b7280; font-size: 14px; }

        .media-wrapper { 
            width: 100%; aspect-ratio: 16/9; background: #000; 
            border-radius: 12px; overflow: hidden; position: relative; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .timer { 
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%); 
            background: rgba(0,0,0,0.6); color: white; padding: 4px 12px; 
            border-radius: 20px; font-weight: 600; font-size: 14px;
        }

        /* КНОПКИ ЗІ СТАРОГО ДИЗАЙНУ */
        .controls { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        button { 
            width: 100%; padding: 14px; border-radius: 10px; border: none; 
            font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.2s; 
        }
        button:active { transform: scale(0.98); }

        .btn-rec { background: var(--danger); color: white; }
        .btn-stop { background: #374151; color: white; }
        .btn-send { background: var(--primary); color: white; }
        .btn-sec { background: #f3f4f6; color: #374151; }

        #loader { text-align: center; color: #6b7280; }
        .spinner { 
            width: 40px; height: 40px; border: 4px solid #e5e7eb; 
            border-top: 4px solid var(--primary); border-radius: 50%; 
            animation: spin 1s linear infinite; margin: 0 auto 15px auto; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        #status { font-size: 13px; margin-top: 10px; font-weight: 500; }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <p id="loader-text">Loading...</p>
</div>

<div class="container" id="app">
    <header>
        <h2 id="formName">Video Response</h2>
        <p>Record your answer</p>
    </header>

    <div class="media-wrapper">
        <div class="timer" id="timer">00:00</div>
        <video id="preview" autoplay muted playsinline></video>
    </div>

    <div id="controls-init" class="controls">
        <button class="btn-rec" onclick="startRec()">● Start Recording</button>
    </div>

    <div id="controls-active" class="controls hidden">
        <button class="btn-stop" onclick="stopRec()">⏹ Stop</button>
    </div>

    <div id="controls-review" class="controls hidden">
        <button class="btn-send" id="sendBtn" onclick="processAndUpload()">🚀 Send Response</button>
        <button class="btn-sec" onclick="location.reload()">🔄 Retake</button>
    </div>
    
    <div id="status"></div>
</div>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({ log: true });
    
    let stream, recorder, chunks = [], seconds = 0, timerInterval;
    let targetEmail = "", formTitle = "";

    async function init() {
        const id = window.location.pathname.split('/').pop();
        try {
            const res = await fetch(`/api/link-info/${id}`);
            if (!res.ok) throw new Error("Link not found");
            const data = await res.json();
            
            targetEmail = data.email;
            formTitle = data.formName;
            document.getElementById('formName').innerText = formTitle;

            document.getElementById('loader-text').innerText = "Initializing optimizer...";
            if (!ffmpeg.isLoaded()) await ffmpeg.load();

            stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('preview').srcObject = stream;
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('app').style.display = 'flex';
        } catch (e) {
            document.getElementById('loader').innerHTML = `<p style="color:red">❌ Invalid Link</p>`;
        }
    }

    function startRec() {
        recorder = new MediaRecorder(stream);
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.start();
        document.getElementById('controls-init').classList.add('hidden');
        document.getElementById('controls-active').classList.remove('hidden');
        timerInterval = setInterval(() => {
            seconds++;
            document.getElementById('timer').innerText = new Date(seconds * 1000).toISOString().substr(14, 5);
        }, 1000);
    }

    function stopRec() {
        recorder.stop();
        clearInterval(timerInterval);
        document.getElementById('controls-active').classList.add('hidden');
        document.getElementById('controls-review').classList.remove('hidden');
        
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            document.getElementById('preview').srcObject = null;
            document.getElementById('preview').src = URL.createObjectURL(blob);
            document.getElementById('preview').muted = false;
            document.getElementById('preview').controls = true;
        };
    }

    async function processAndUpload() {
        const btn = document.getElementById('sendBtn');
        const status = document.getElementById('status');
        btn.disabled = true;
        
        try {
            status.innerText = "⏳ Compressing video (please wait)...";
            status.style.color = "#6366F1";
            
            const webmBlob = new Blob(chunks, { type: 'video/webm' });
            ffmpeg.FS('writeFile', 'input.webm', await fetchFile(webmBlob));
            
            // Стиснення: Швидкий пресет, якість 28
            await ffmpeg.run('-i', 'input.webm', '-vcodec', 'libx264', '-crf', '28', '-preset', 'ultrafast', 'output.mp4');
            
            const mp4Data = ffmpeg.FS('readFile', 'output.mp4');
            const mp4Blob = new Blob([mp4Data.buffer], { type: 'video/mp4' });

            status.innerText = "🚀 Uploading...";

            const fd = new FormData();
            fd.append('file', mp4Blob, `rec_${Date.now()}.mp4`);
            fd.append('folder', targetEmail);
            fd.append('subfolder', formTitle);

            const uploadRes = await fetch('/api/upload-with-ai', { method: 'POST', body: fd });
            if (!uploadRes.ok) throw new Error("Server Error");

            status.innerText = "✅ Successfully Sent!";
            status.style.color = "#10b981";
            document.getElementById('controls-review').classList.add('hidden');
            
        } catch (e) {
            status.innerText = "❌ Error: " + e.message;
            status.style.color = "#ef4444";
            btn.disabled = false;
        }
    }

    init();
</script>
</body>
</html>
