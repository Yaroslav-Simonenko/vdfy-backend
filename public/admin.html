<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VDFY Admin Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-50 text-gray-800" x-data="appData()">

    <div x-show="!user" class="fixed inset-0 z-50 flex items-center justify-center bg-white">
        <div class="text-center">
            <h1 class="text-4xl font-bold text-indigo-600 mb-2">VDFY Admin</h1>
            <p id="error-msg" class="text-red-500 mb-4 text-sm font-mono hidden"></p>
            <button @click="login" class="bg-indigo-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-indigo-700 transition">
                Sign in with Google
            </button>
        </div>
    </div>

    <div x-show="user" class="flex h-screen overflow-hidden" style="display: none;">
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col z-10">
            <div class="h-16 flex items-center px-6 border-b border-gray-100 text-2xl font-bold text-indigo-600">VDFY</div>
            <nav class="flex-1 px-3 py-4 space-y-1">
                <template x-for="item in navItems" :key="item.id">
                    <a href="#" @click.prevent="currentTab = item.id" :class="currentTab === item.id ? 'bg-indigo-50 text-indigo-600' : 'text-gray-600 hover:bg-gray-50'" class="flex items-center px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
                        <span x-html="item.icon" class="w-5 h-5 mr-3"></span>
                        <span x-text="item.label"></span>
                    </a>
                </template>
            </nav>
            <div class="p-4 border-t border-gray-100">
                <p class="text-sm font-medium text-gray-700 truncate" x-text="user?.email"></p>
                <button @click="logout" class="text-xs text-red-500 mt-1">Sign Out</button>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto bg-gray-50 p-8">
            <div x-show="currentTab === 'dashboard'">
                <h2 class="text-2xl font-bold mb-6">Overview</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
                        <p class="text-gray-500 text-sm">Total Videos</p>
                        <h3 class="text-3xl font-bold" x-text="stats.totalVideos">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
                        <p class="text-gray-500 text-sm">Active Forms</p>
                        <h3 class="text-3xl font-bold" x-text="stats.activeForms">0</h3>
                    </div>
                </div>
            </div>

            <div x-show="currentTab === 'media'">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">Media Library</h2>
                    <button x-show="viewMode === 'videos'" @click="viewMode = 'folders'" class="text-indigo-600">← Back</button>
                </div>
                <div x-show="viewMode === 'folders'" class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <template x-for="(videos, folderName) in groupedVideos" :key="folderName">
                        <div @click="openFolder(folderName)" class="bg-white p-6 rounded-xl border hover:shadow-md cursor-pointer text-center">
                            <div class="text-4xl mb-2">📁</div>
                            <h3 class="font-bold" x-text="folderName"></h3>
                            <span class="text-xs text-gray-400" x-text="videos.length + ' videos'"></span>
                        </div>
                    </template>
                </div>
                <div x-show="viewMode === 'videos'" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <template x-for="video in currentFolderVideos" :key="video.key">
                        <div class="bg-white rounded-xl border overflow-hidden shadow-sm">
                            <video controls :src="video.url" class="w-full h-40 bg-black object-cover"></video>
                            <div class="p-3">
                                <p class="text-xs text-gray-400 mb-2" x-text="new Date(video.uploadedAt).toLocaleString()"></p>
                                <div class="flex gap-2">
                                    <button @click="viewText(video.textUrl)" class="flex-1 py-1 text-sm border rounded">Text</button>
                                    <button @click="analyzeSingle(video.textUrl)" class="flex-1 py-1 text-sm bg-indigo-600 text-white rounded">AI</button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
            
            <div x-show="currentTab === 'ai'">
                <h2 class="text-2xl font-bold">AI Analyst</h2>
                <div class="bg-white p-6 rounded-xl border"><p>AI tools coming soon.</p></div>
            </div>
            <div x-show="currentTab === 'billing'">
                <h2 class="text-2xl font-bold">Billing</h2>
                <div class="bg-white p-6 rounded-xl border"><p>Manage subscription.</p></div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // ==========================================
        // 👇👇👇 ТУТ ВСТАВ СВІЙ КОНФІГ 👇👇👇
        // ==========================================
        const firebaseConfig = {
            apiKey: "ВСТАВ_СЮДИ",
            authDomain: "ВСТАВ_СЮДИ",
            projectId: "ВСТАВ_СЮДИ",
            storageBucket: "ВСТАВ_СЮДИ",
            messagingSenderId: "ВСТАВ_СЮДИ",
            appId: "ВСТАВ_СЮДИ"
        };
        // ==========================================

        // Перевірка на помилки
        if (firebaseConfig.apiKey === "ВСТАВ_СЮДИ" || !firebaseConfig.apiKey) {
            document.getElementById('error-msg').innerText = "❌ ПОМИЛКА: Ти не вставив Firebase Config у код!";
            document.getElementById('error-msg').classList.remove('hidden');
            throw new Error("No API Key");
        }

        let app, auth, provider;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            provider = new GoogleAuthProvider();
        } catch(e) {
            alert("Помилка конфігурації: " + e.message);
        }

        document.addEventListener('alpine:init', () => {
            Alpine.data('appData', () => ({
                user: null,
                currentTab: 'dashboard',
                viewMode: 'folders',
                groupedVideos: {},
                currentFolderVideos: [],
                stats: { totalVideos: 0, activeForms: 0 },
                navItems: [
                    { id: 'dashboard', label: 'Dashboard', icon: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>' },
                    { id: 'media', label: 'Media Library', icon: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>' },
                    { id: 'ai', label: 'AI Analyst', icon: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>' },
                    { id: 'billing', label: 'Billing', icon: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>' }
                ],
                init() {
                    onAuthStateChanged(auth, u => {
                        this.user = u;
                        if(u) this.loadData();
                    });
                },
                login() { signInWithPopup(auth, provider); },
                logout() { signOut(auth); },
                async loadData() {
                    if (!this.user) return;
                    try {
                        const token = await this.user.getIdToken();
                        const res = await fetch('/api/my-videos', { headers: { 'Authorization': `Bearer ${token}` } });
                        if(!res.ok) throw new Error("API Error");
                        const data = await res.json();
                        
                        this.groupedVideos = {};
                        let total = 0;
                        data.videos.forEach(v => {
                            const f = v.formName || "General";
                            if (!this.groupedVideos[f]) this.groupedVideos[f] = [];
                            this.groupedVideos[f].push(v);
                            total++;
                        });
                        this.stats.totalVideos = total;
                        this.stats.activeForms = Object.keys(this.groupedVideos).length;
                    } catch (e) { console.error(e); }
                },
                openFolder(name) {
                    this.currentFolderVideos = this.groupedVideos[name];
                    this.viewMode = 'videos';
                },
                async viewText(url) {
                    try {
                        const res = await fetch(url);
                        if (!res.ok) throw new Error();
                        alert("📝 Transcript:\n\n" + await res.text());
                    } catch(e) { alert("Transcript not found."); }
                },
                analyzeSingle(url) { alert("AI Feature in development."); }
            }));
        });
    </script>
</body>
</html>
