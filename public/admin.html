<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>VDFY Admin - Restricted Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <style>
        .active-tab { border-bottom: 2px solid #2563eb; color: #2563eb; }
        details > summary { list-style: none; cursor: pointer; }
        details > summary::-webkit-details-marker { display: none; }
        /* Анімація для папок */
        details[open] summary ~ * { animation: sweep .3s ease-in-out; }
        @keyframes sweep {
            0%    {opacity: 0; transform: translateY(-10px)}
            100%  {opacity: 1; transform: translateY(0)}
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <div id="login-screen" class="flex flex-col items-center justify-center min-h-screen">
        <div class="bg-white p-8 rounded-lg shadow-lg w-96 border border-gray-200">
            <div class="flex justify-center mb-6">
                <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center text-white text-2xl font-bold">A</div>
            </div>
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Admin Access</h2>
            
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="email" required class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" required class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div id="login-error" class="text-red-500 text-sm text-center hidden"></div>
                <button type="submit" id="login-btn" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition font-bold">
                    Увійти в систему
                </button>
            </form>
        </div>
        <p class="mt-4 text-gray-400 text-sm">Protected Area. IP Logged.</p>
    </div>

    <div id="admin-panel" class="hidden">
        
        <nav class="bg-white shadow px-6 py-4 flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-blue-600 rounded text-white flex items-center justify-center font-bold">V</div>
                <h1 class="text-xl font-bold text-gray-800">VDFY Control</h1>
            </div>
            <div class="flex gap-4 items-center">
                <span id="admin-display-email" class="text-gray-500 text-sm"></span>
                <button onclick="logout()" class="bg-red-50 text-red-600 border border-red-200 px-4 py-1 rounded hover:bg-red-100 text-sm font-bold">Вихід</button>
            </div>
        </nav>

        <div class="max-w-7xl mx-auto mt-6 px-6 border-b border-gray-300 flex gap-8">
            <button onclick="switchTab('videos')" id="tab-videos" class="pb-3 px-2 font-medium text-gray-500 active-tab flex items-center gap-2">
                📂 Папки користувачів
            </button>
            <button onclick="switchTab('clients')" id="tab-clients" class="pb-3 px-2 font-medium text-gray-500 hover:text-gray-700 flex items-center gap-2">
                👥 База клієнтів
            </button>
        </div>

        <div class="max-w-7xl mx-auto p-6">
            
            <div id="view-videos">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold text-gray-700">Структура файлів</h2>
                    <button onclick="loadVideos()" class="text-blue-600 text-sm hover:underline">🔄 Оновити дані</button>
                </div>
                <div id="folders-container" class="space-y-4">
                    <p class="text-gray-400">Завантаження...</p>
                </div>
            </div>

            <div id="view-clients" class="hidden">
                <div class="bg-white shadow rounded-lg overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">Користувач</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">Дата реєстрації</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">Статус</th>
                                <th class="px-6 py-3 text-right text-xs font-bold text-gray-500 uppercase">Управління</th>
                            </tr>
                        </thead>
                        <tbody id="clients-table" class="bg-white divide-y divide-gray-200"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        // 👇👇👇 ВСТАВ СЮДИ СВОЇ ДАНІ (ТІ САМІ ЩО В DASHBOARD) 👇👇👇
         const firebaseConfig = {
    apiKey: "AIzaSyDBUbYLkuMMQaKHomNursjJ1zoFNtIZjy4",
    authDomain: "vdfy-auth-system.firebaseapp.com",
    projectId: "vdfy-auth-system",
    storageBucket: "vdfy-auth-system.firebasestorage.app",
    messagingSenderId: "381929137400",
    appId: "1:381929137400:web:661c3b07907e639fa5070d"
  };
        // 👆👆👆

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const ADMIN_EMAIL = "simonenkoyaroslav2008@gmail.com"; 

        // 1. АВТОМАТИЧНА ПЕРЕВІРКА ПРИ ЗАВАНТАЖЕННІ
        auth.onAuthStateChanged(user => {
            if (user && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                // Якщо це адмін - показуємо панель
                showAdminPanel(user);
            } else {
                // Якщо це не адмін або ніхто - показуємо вхід
                showLoginScreen();
                if (user) {
                    console.warn("Unauthorized access attempt by:", user.email);
                    auth.signOut(); // Викидаємо чужаків
                }
            }
        });

        // 2. ЛОГІКА ВХОДУ (LOGIN)
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            const err = document.getElementById('login-error');

            btn.innerText = "Перевірка...";
            err.classList.add('hidden');

            try {
                // Перевірка: чи це взагалі адмінська пошта?
                if (email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
                    throw new Error("Ця пошта не має прав адміністратора.");
                }

                await auth.signInWithEmailAndPassword(email, password);
                // onAuthStateChanged спрацює автоматично і відкриє панель
            
            } catch (error) {
                console.error(error);
                err.innerText = "Помилка: " + error.message;
                err.classList.remove('hidden');
                btn.innerText = "Увійти в систему";
            }
        }

        function showAdminPanel(user) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
            document.getElementById('admin-display-email').innerText = user.email;
            
            // Завантажуємо дані
            loadVideos(); 
            loadClients();
        }

        function showLoginScreen() {
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        async function logout() {
            await auth.signOut();
            window.location.reload();
        }

        // 3. ЛОГІКА ПАПОК (ВІДЕО)
        async function loadVideos() {
            const token = await auth.currentUser.getIdToken();
            const res = await fetch('/api/my-videos', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            
            // ГРУПУВАННЯ ПО ЮЗЕРАХ (ВЛАСНИКАХ)
            const grouped = {};
            data.videos.forEach(vid => {
                if (!grouped[vid.owner]) grouped[vid.owner] = [];
                grouped[vid.owner].push(vid);
            });

            const container = document.getElementById('folders-container');
            container.innerHTML = '';

            // Рендер кожної "Папки"
            Object.keys(grouped).forEach(owner => {
                const videos = grouped[owner];
                const folder = document.createElement('details');
                folder.className = "bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden group";
                
                let videosHTML = `<div class="p-4 bg-gray-50 grid grid-cols-1 md:grid-cols-3 gap-4">`;
                videos.forEach(vid => {
                    videosHTML += `
                        <div class="bg-white p-3 rounded shadow border border-gray-100">
                            <div class="flex justify-between mb-2">
                                <span class="text-xs font-bold text-gray-600 truncate w-32">${vid.formName}</span>
                                <a href="${vid.url}" target="_blank" class="text-blue-500 text-xs">Play ▶</a>
                            </div>
                            <video src="${vid.url}" controls class="w-full h-24 bg-black rounded"></video>
                            <div class="mt-2 flex justify-end">
                                <button onclick="deleteVideo('${vid.key}')" class="text-red-500 text-xs hover:text-red-700">🗑 Видалити</button>
                            </div>
                        </div>
                    `;
                });
                videosHTML += `</div>`;

                folder.innerHTML = `
                    <summary class="flex items-center justify-between p-4 bg-white hover:bg-gray-50 transition select-none">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl">📁</span>
                            <div>
                                <h3 class="font-bold text-gray-800">${owner}</h3>
                                <p class="text-xs text-gray-500">${videos.length} файлів</p>
                            </div>
                        </div>
                        <span class="text-gray-400 transform group-open:rotate-180 transition">▼</span>
                    </summary>
                    ${videosHTML}
                `;
                container.appendChild(folder);
            });
        }

        async function deleteVideo(key) {
            if(!confirm("Видалити відео?")) return;
            const token = await auth.currentUser.getIdToken();
            await fetch('/api/delete-video', {
                 method: 'DELETE',
                 headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                 body: JSON.stringify({ videoKey: key })
            });
            loadVideos(); // Перезавантажити список
        }

        // 4. КЛІЄНТИ (Логіка без змін, але прихована за табом)
        async function loadClients() {
            const token = await auth.currentUser.getIdToken();
            try {
                const res = await fetch('/api/admin/users', { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                const tbody = document.getElementById('clients-table');
                tbody.innerHTML = '';

                data.users.forEach(u => {
                    const isBlocked = u.disabled;
                    const btnClass = isBlocked ? "text-green-600" : "text-orange-600";
                    const btnText = isBlocked ? "Розблокувати" : "Заблокувати";
                    const status = isBlocked ? '<span class="text-red-600 font-bold bg-red-100 px-2 rounded">BANNED</span>' : '<span class="text-green-600 font-bold bg-green-100 px-2 rounded">Active</span>';

                    tbody.innerHTML += `
                        <tr>
                            <td class="px-6 py-4 text-sm font-medium text-gray-900">${u.email}</td>
                            <td class="px-6 py-4 text-sm text-gray-500">${new Date(u.creationTime).toLocaleDateString()}</td>
                            <td class="px-6 py-4 text-sm">${status}</td>
                            <td class="px-6 py-4 text-right text-sm">
                                <button onclick="toggleUser('${u.uid}', ${!isBlocked})" class="${btnClass} font-bold mr-4">${btnText}</button>
                                <button onclick="deleteUser('${u.uid}')" class="text-red-600 font-bold">Видалити</button>
                            </td>
                        </tr>
                    `;
                });
            } catch(e) { console.error(e); }
        }

        async function toggleUser(uid, disable) {
            const token = await auth.currentUser.getIdToken();
            await fetch('/api/admin/toggle-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ uid, disabled: disable })
            });
            loadClients();
        }

        async function deleteUser(uid) {
            if(!confirm("Видалити юзера назавжди?")) return;
            const token = await auth.currentUser.getIdToken();
            await fetch('/api/admin/delete-user', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ uid })
            });
            loadClients();
        }

        function switchTab(tab) {
            document.getElementById('view-videos').classList.add('hidden');
            document.getElementById('view-clients').classList.add('hidden');
            document.getElementById('tab-videos').classList.remove('active-tab');
            document.getElementById('tab-clients').classList.remove('active-tab');

            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.add('active-tab');
        }
    </script>
</body>
</html>
