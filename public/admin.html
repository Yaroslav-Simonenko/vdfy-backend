<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VDFY Admin</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-width: 260px; max-width: 260px; height: 100vh; background: #212529; color: white; display: flex; flex-direction: column; position: fixed; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 12px 20px; display: block; border-radius: 6px; margin: 4px 10px; transition: 0.2s; }
        .sidebar a:hover, .sidebar a.active { background: #0d6efd; color: white; }
        .content-wrapper { margin-left: 260px; padding: 30px; }
        [x-cloak] { display: none !important; }
    </style>
</head>

<body x-data="initApp()" x-cloak>

    <div x-show="!user" class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow p-5 text-center" style="max-width: 400px; width: 100%;">
            <h1 class="mb-4">🔐</h1>
            <h3 class="mb-4">VDFY Admin</h3>
            <button @click="loginWithGoogle" class="btn btn-dark w-100 py-3 fw-bold shadow-sm">
                <i class="bi bi-google me-2"></i> Увійти через Google
            </button>
        </div>
    </div>

    <div x-show="user">
        <div class="sidebar">
            <div class="p-4 fs-4 fw-bold text-white border-bottom border-secondary">
                <i class="bi bi-camera-reels me-2"></i>VDFY
            </div>
            <nav class="mt-3">
                <a href="#" @click.prevent="tab = 'dash'" :class="tab==='dash' ? 'active' : ''">
                    <i class="bi bi-speedometer2 me-2"></i> Dashboard
                </a>
                <a href="#" @click.prevent="tab = 'media'" :class="tab==='media' ? 'active' : ''">
                    <i class="bi bi-collection-play me-2"></i> Media Library
                </a>
            </nav>
            <div class="mt-auto p-3 border-top border-secondary">
                <div class="d-flex align-items-center mb-3">
                    <div class="bg-secondary rounded-circle d-flex align-items-center justify-content-center text-white me-2" style="width: 32px; height: 32px; font-size: 12px;">
                        User
                    </div>
                    <small x-text="user?.email" class="d-block text-truncate text-muted" style="max-width: 150px;"></small>
                </div>
                <button @click="logoutUser" class="btn btn-sm btn-outline-danger w-100">Вийти</button>
            </div>
        </div>

        <div class="content-wrapper">
            <div x-show="tab === 'dash'">
                <h2>Dashboard</h2>
                <div class="row mt-4">
                    <div class="col-md-4">
                        <div class="card p-4 shadow-sm border-0 bg-primary text-white h-100">
                            <h5>Всього завантажено</h5>
                            <h1 class="display-4 fw-bold mb-0" x-text="videos.length">0</h1>
                        </div>
                    </div>
                </div>
            </div>

            <div x-show="tab === 'media'">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Media Library</h2>
                    <button @click="loadData(user)" class="btn btn-primary">
                        <i class="bi bi-arrow-clockwise"></i> Оновити список
                    </button>
                </div>
                
                <div class="row g-4">
                    <template x-for="video in videos" :key="video.key">
                        <div class="col-md-4 col-lg-3">
                            <div class="card shadow-sm h-100 border-0">
                                <div class="ratio ratio-16x9 bg-black rounded-top position-relative">
                                    <video :src="video.url" controls class="object-fit-cover"></video>
                                </div>
                                <div class="card-body">
                                    <h6 class="card-title fw-bold text-truncate" x-text="video.formName || 'General'"></h6>
                                    <p class="card-text small text-muted mb-3">
                                        <span x-text="new Date(video.uploadedAt).toLocaleString()"></span>
                                    </p>
                                    <button @click="deleteVid(video.key)" class="btn btn-sm btn-outline-danger w-100">Видалити</button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
                <div x-show="videos.length === 0" class="text-center text-muted py-5 mt-5">
                    <h4>Поки що пусто</h4>
                </div>
            </div>
        </div>
    </div>

    <script>
        function initApp() {
            return {
                user: null,
                tab: 'dash',
                videos: [],

                init() {
                    // Просто чекаємо Firebase тихо, без спінера
                    const check = setInterval(() => {
                        if (window.firebaseReady && window.authObj) {
                            clearInterval(check);
                            window.authObj.onAuthStateChanged(window.authInst, (u) => {
                                this.user = u;
                                if (u) this.loadData(u);
                            });
                        }
                    }, 100);
                },

                loginWithGoogle() { 
                    if(!window.authObj) return alert("Секунду, система ініціалізується...");
                    window.authObj.signInWithPopup(window.authInst, window.providerInst).catch(e => alert(e.message)); 
                },
                
                logoutUser() { window.authObj.signOut(window.authInst); },

                async loadData(user) {
                    try {
                        const token = await user.getIdToken();
                        const res = await fetch('/api/my-videos', { headers: { 'Authorization': `Bearer ${token}` }});
                        const data = await res.json();
                        this.videos = data.videos || [];
                    } catch(e) { console.error(e); }
                },

                async deleteVid(key) {
                    if(!confirm("Видалити?")) return;
                    const token = await this.user.getIdToken();
                    await fetch('/api/delete-video', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ videoKey: key })
                    });
                    this.loadData(this.user);
                }
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBUbYLkuMMQaKzoFNtIZjy4",
            authDomain: "vdfy-auth-system.firebaseapp.com",
            projectId: "vdfy-auth-system",
            storageBucket: "vdfy-auth-system.firebasestorage.app",
            messagingSenderId: "3874",
            appId: "1:381929137400:"
        };

        try {
            const app = initializeApp(firebaseConfig);
            window.authInst = getAuth(app);
            window.providerInst = new GoogleAuthProvider();
            window.authObj = { signInWithPopup, signOut, onAuthStateChanged };
            window.firebaseReady = true;
        } catch(e) { console.error(e); }
    </script>
</body>
</html>
