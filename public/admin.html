<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VDFY Admin - Debug Mode</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        body { font-family: sans-serif; }
        #debug-console { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #fff0f0; color: #cc0000; z-index: 9999; padding: 20px; 
            font-family: monospace; font-size: 16px; white-space: pre-wrap; display: none;
        }
    </style>
</head>
<body class="bg-gray-50" x-data="appData()">

    <div id="debug-console"></div>

    <div x-show="false" class="fixed inset-0 flex items-center justify-center bg-gray-100 text-gray-500" style="display: flex;">
        <div id="loading-msg">Завантаження інтерфейсу...<br>(Якщо цей напис не зникає, значить Alpine.js не запустився)</div>
    </div>

    <div x-show="!user" style="display: none;" class="fixed inset-0 z-50 flex items-center justify-center bg-white">
        <div class="text-center">
            <h1 class="text-4xl font-bold text-indigo-600 mb-2">VDFY Admin</h1>
            <p class="text-gray-500 mb-6">Діагностична версія</p>
            <button @click="login" class="bg-indigo-600 text-white px-6 py-3 rounded font-bold shadow hover:bg-indigo-700">
                Увійти через Google
            </button>
        </div>
    </div>

    <div x-show="user" style="display: none;" class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-white border-r flex flex-col">
            <div class="h-16 flex items-center px-6 font-bold text-indigo-600 text-2xl">VDFY</div>
            <nav class="flex-1 px-3 py-4 space-y-1">
                <template x-for="item in navItems" :key="item.id">
                    <a href="#" @click.prevent="currentTab = item.id" :class="currentTab === item.id ? 'bg-indigo-50 text-indigo-600' : 'text-gray-600'" class="flex items-center px-3 py-2 rounded">
                        <span x-text="item.label"></span>
                    </a>
                </template>
            </nav>
            <div class="p-4 border-t">
                <p x-text="user?.email" class="text-sm font-bold"></p>
                <button @click="logout" class="text-red-500 text-xs">Вийти</button>
            </div>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <h1 class="text-2xl font-bold mb-4" x-text="navItems.find(i=>i.id===currentTab).label"></h1>
            
            <div x-show="currentTab === 'dashboard'">
                <div class="bg-white p-6 rounded shadow">
                    <h3 class="text-xl">Відео: <span x-text="stats.totalVideos"></span></h3>
                </div>
            </div>

            <div x-show="currentTab === 'media'">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <template x-for="(videos, folder) in groupedVideos" :key="folder">
                        <div class="bg-white p-4 rounded shadow border cursor-pointer" @click="alert('Folder: ' + folder)">
                            <div class="text-2xl">📁</div>
                            <div x-text="folder"></div>
                            <div class="text-xs text-gray-500" x-text="videos.length + ' файлів'"></div>
                        </div>
                    </template>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Глобальний перехоплювач помилок
        window.onerror = function(msg, url, line, col, error) {
            const debugBox = document.getElementById('debug-console');
            debugBox.style.display = 'block';
            debugBox.innerHTML += `🔴 ПОМИЛКА:\n${msg}\nLine: ${line}\n\n`;
            document.getElementById('loading-msg').style.display = 'none';
        };
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // 👇👇👇 ТУТ УВАЖНО ВСТАВ СВОЇ КЛЮЧІ 👇👇👇
        const firebaseConfig = {
    apiKey: "AIzaSyDBUbYLkuMMQaKHomNursjJ1zoFNtIZjy4",
    authDomain: "vdfy-auth-system.firebaseapp.com",
    projectId: "vdfy-auth-system",
    storageBucket: "vdfy-auth-system.firebasestorage.app",
    messagingSenderId: "381929137400",
    appId: "1:381929137400:web:661c3b07907e639fa5070d"
  };

        // 👆👆👆 ПЕРЕВІР, ЩОБ НЕ БУЛО ЗАЙВИХ КОМ (,) АБО ДУЖОК

        let app, auth, provider;

        try {
            // Перевірка, чи замінив користувач ключі
            if (firebaseConfig.apiKey.includes("AIzaSyDBUbYLkuMMQaKHomNursjJ1zoFNtIZjy4")) {
                throw new Error("Ти забув вставити ключі Firebase у код! Знайди рядок 85.");
            }
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            provider = new GoogleAuthProvider();
        } catch (e) {
            throw e; // Передаємо помилку на екран
        }

        document.addEventListener('alpine:init', () => {
            Alpine.data('appData', () => ({
                user: null,
                currentTab: 'dashboard',
                groupedVideos: {},
                stats: { totalVideos: 0 },
                navItems: [
                    { id: 'dashboard', label: 'Dashboard' },
                    { id: 'media', label: 'Media Library' },
                    { id: 'ai', label: 'AI Analyst' },
                    { id: 'billing', label: 'Billing' }
                ],
                init() {
                    console.log("Alpine init");
                    if(auth) {
                        onAuthStateChanged(auth, u => {
                            this.user = u;
                            if(u) this.loadData();
                        });
                    }
                },
                login() { signInWithPopup(auth, provider); },
                logout() { signOut(auth); },
                async loadData() {
                    if (!this.user) return;
                    try {
                        const token = await this.user.getIdToken();
                        const res = await fetch('/api/my-videos', { headers: { 'Authorization': `Bearer ${token}` } });
                        const data = await res.json();
                        
                        this.groupedVideos = {};
                        let total = 0;
                        data.videos.forEach(v => {
                            const f = v.formName || "General";
                            if (!this.groupedVideos[f]) this.groupedVideos[f] = [];
                            this.groupedVideos[f].push(v);
                            total++;
                        });
                        this.stats.totalVideos = total;
                    } catch (e) { console.error(e); }
                }
            }));
        });
    </script>
</body>
</html>
