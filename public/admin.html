<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VDFY Admin (Bootstrap)</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        body { background-color: #f8f9fa; overflow: hidden; }
        .sidebar { min-width: 260px; max-width: 260px; height: 100vh; background: #212529; color: white; display: flex; flex-direction: column; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 12px 20px; display: block; border-radius: 6px; margin: 4px 10px; transition: 0.2s; }
        .sidebar a:hover, .sidebar a.active { background: #0d6efd; color: white; }
        .main-content { flex-grow: 1; height: 100vh; overflow-y: auto; padding: 30px; }
        .card-video { transition: transform 0.2s; cursor: pointer; }
        .card-video:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .video-preview { height: 180px; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .video-preview video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Екран завантаження */
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="appData()" x-cloak>

    <div x-show="!user" class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow-lg p-4 text-center" style="max-width: 400px; width: 100%;">
            <div class="display-1 text-primary mb-3"><i class="bi bi-camera-reels"></i></div>
            <h2 class="fw-bold mb-2">VDFY Admin</h2>
            <p class="text-muted mb-4">Увійдіть, щоб керувати відео</p>
            <button @click="login" class="btn btn-dark btn-lg w-100">
                <i class="bi bi-google me-2"></i> Sign in with Google
            </button>
        </div>
    </div>

    <div x-show="user" class="d-flex h-100">
        
        <div class="sidebar shadow">
            <div class="d-flex align-items-center p-4 border-bottom border-secondary">
                <i class="bi bi-camera-reels-fill text-primary fs-3 me-2"></i>
                <span class="fs-4 fw-bold">VDFY</span>
            </div>
            
            <nav class="mt-3 flex-grow-1">
                <a href="#" @click.prevent="currentTab = 'dashboard'" :class="currentTab === 'dashboard' ? 'active' : ''">
                    <i class="bi bi-speedometer2 me-2"></i> Dashboard
                </a>
                <a href="#" @click.prevent="currentTab = 'media'" :class="currentTab === 'media' ? 'active' : ''">
                    <i class="bi bi-collection-play me-2"></i> Media Library
                </a>
                <a href="#" @click.prevent="currentTab = 'ai'" :class="currentTab === 'ai' ? 'active' : ''">
                    <i class="bi bi-robot me-2"></i> AI Analysis
                </a>
            </nav>

            <div class="p-3 border-top border-secondary bg-dark">
                <div class="d-flex align-items-center mb-2">
                    <img :src="user?.photoURL" class="rounded-circle me-2" width="32" height="32">
                    <div class="text-truncate" style="max-width: 160px;">
                        <small class="d-block fw-bold" x-text="user?.displayName"></small>
                        <small class="text-muted" style="font-size: 10px;" x-text="user?.email"></small>
                    </div>
                </div>
                <button @click="logout" class="btn btn-outline-danger btn-sm w-100">Вийти</button>
            </div>
        </div>

        <div class="main-content">
            
            <div x-show="currentTab === 'dashboard'">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3>Dashboard</h3>
                    <button @click="loadData" class="btn btn-sm btn-outline-primary"><i class="bi bi-arrow-clockwise"></i> Оновити</button>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body d-flex align-items-center">
                                <div class="bg-primary bg-opacity-10 p-3 rounded-circle text-primary me-3">
                                    <i class="bi bi-camera-video fs-3"></i>
                                </div>
                                <div>
                                    <h6 class="text-muted mb-0">Всього відео</h6>
                                    <h2 class="mb-0 fw-bold" x-text="stats.totalVideos">0</h2>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body d-flex align-items-center">
                                <div class="bg-success bg-opacity-10 p-3 rounded-circle text-success me-3">
                                    <i class="bi bi-folder fs-3"></i>
                                </div>
                                <div>
                                    <h6 class="text-muted mb-0">Активні форми</h6>
                                    <h2 class="mb-0 fw-bold" x-text="stats.activeForms">0</h2>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div x-show="currentTab === 'media'">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3>Media Library</h3>
                    <button x-show="viewMode === 'videos'" @click="viewMode = 'folders'" class="btn btn-link text-decoration-none">
                        &larr; Назад до папок
                    </button>
                </div>

                <div x-show="viewMode === 'folders'" class="row g-4">
                    <template x-for="(videos, folderName) in groupedVideos" :key="folderName">
                        <div class="col-md-4 col-lg-3">
                            <div @click="openFolder(folderName)" class="card text-center p-4 border-0 shadow-sm h-100 card-video">
                                <div class="text-warning mb-3"><i class="bi bi-folder-fill display-4"></i></div>
                                <h5 class="card-title text-truncate" x-text="folderName"></h5>
                                <span class="badge bg-light text-dark border" x-text="videos.length + ' відео'"></span>
                            </div>
                        </div>
                    </template>
                    <div x-show="Object.keys(groupedVideos).length === 0" class="col-12 text-center text-muted py-5">
                        Немає записів.
                    </div>
                </div>

                <div x-show="viewMode === 'videos'" class="row g-4">
                    <template x-for="video in currentFolderVideos" :key="video.key">
                        <div class="col-md-6 col-lg-4">
                            <div class="card border-0 shadow-sm h-100">
                                <div class="video-preview">
                                    <video controls :src="video.url"></video>
                                </div>
                                <div class="card-body">
                                    <div class="d-flex justify-content-between mb-2">
                                        <small class="text-muted" x-text="new Date(video.uploadedAt).toLocaleString()"></small>
                                    </div>
                                    <div class="d-flex gap-2 mb-2">
                                        <button @click="viewText(video.textUrl)" class="btn btn-outline-secondary btn-sm flex-fill">
                                            <i class="bi bi-file-text"></i> Текст
                                        </button>
                                        <button @click="analyzeSingle(video.textUrl)" class="btn btn-primary btn-sm flex-fill">
                                            <i class="bi bi-magic"></i> AI
                                        </button>
                                    </div>
                                    <button @click="deleteVideo(video.key)" class="btn btn-link text-danger btn-sm w-100 text-decoration-none">
                                        Видалити
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <div x-show="currentTab === 'ai'">
                <div class="text-center py-5">
                    <div class="text-primary mb-3"><i class="bi bi-stars display-1"></i></div>
                    <h3>AI Analyst</h3>
                    <p class="text-muted">Ця функція з'явиться у наступному оновленні.</p>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // ====================================================
        // 👇👇👇 ТУТ ВСТАВ КЛЮЧІ FIREBASE 👇👇👇
        // ====================================================
        const firebaseConfig = {
    apiKey: "AIzaSyDBUbYLkuMMQaKHomNursjJ1zoFNtIZjy4",
    authDomain: "vdfy-auth-system.firebaseapp.com",
    projectId: "vdfy-auth-system",
    storageBucket: "vdfy-auth-system.firebasestorage.app",
    messagingSenderId: "381929137400",
    appId: "1:381929137400:web:661c3b07907e639fa5070d"
  };
        // ====================================================

        let app, auth, provider;
        

        document.addEventListener('alpine:init', () => {
            Alpine.data('appData', () => ({
                user: null,
                currentTab: 'dashboard',
                viewMode: 'folders',
                groupedVideos: {},
                currentFolderVideos: [],
                stats: { totalVideos: 0, activeForms: 0 },

                init() {
                    if (auth) {
                        onAuthStateChanged(auth, u => {
                            this.user = u;
                            if(u) this.loadData();
                        });
                    }
                },

                login() { if(auth) signInWithPopup(auth, provider); },
                logout() { if(auth) signOut(auth); },

                async loadData() {
                    if (!this.user) return;
                    try {
                        const token = await this.user.getIdToken();
                        const res = await fetch('/api/my-videos', { headers: { 'Authorization': `Bearer ${token}` } });
                        const data = await res.json();
                        
                        this.groupedVideos = {};
                        let total = 0;
                        data.videos.forEach(v => {
                            const f = v.formName || "General";
                            if (!this.groupedVideos[f]) this.groupedVideos[f] = [];
                            this.groupedVideos[f].push(v);
                            total++;
                        });
                        this.stats.totalVideos = total;
                        this.stats.activeForms = Object.keys(this.groupedVideos).length;
                    } catch (e) { console.error(e); }
                },

                openFolder(name) {
                    this.currentFolderVideos = this.groupedVideos[name];
                    this.viewMode = 'videos';
                },

                async viewText(url) {
                    try {
                        const res = await fetch(url);
                        if (!res.ok) throw new Error();
                        alert("📝 Transcript:\n\n" + await res.text());
                    } catch(e) { alert("Ще обробляється..."); }
                },
                
                analyzeSingle() { alert("Скоро буде!"); },
                
                async deleteVideo(key) {
                    if(!confirm("Видалити?")) return;
                    const token = await this.user.getIdToken();
                    await fetch('/api/delete-video', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ videoKey: key })
                    });
                    this.loadData();
                }
            }));
        });
    </script>
</body>
</html>
