<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>VDFY Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <style>
        .active-tab { border-bottom: 2px solid #2563eb; color: #2563eb; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-white shadow px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-600">VDFY Admin</h1>
        <div class="flex gap-4">
            <span id="admin-email" class="text-gray-600 text-sm py-2">Loading...</span>
            <button onclick="logout()" class="text-red-500 hover:text-red-700 text-sm font-bold">Вийти</button>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto mt-6 px-6 border-b border-gray-200 flex gap-6">
        <button onclick="switchTab('videos')" id="tab-videos" class="pb-3 px-2 font-medium text-gray-500 active-tab">
            📹 Всі відео
        </button>
        <button onclick="switchTab('clients')" id="tab-clients" class="pb-3 px-2 font-medium text-gray-500 hover:text-gray-700">
            👥 Клієнти
        </button>
    </div>

    <div class="max-w-6xl mx-auto p-6">
        
        <div id="view-videos">
            <h2 class="text-lg font-bold mb-4">Останні завантаження</h2>
            <div id="video-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <p class="text-gray-400">Завантаження...</p>
            </div>
        </div>

        <div id="view-clients" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold">Управління користувачами</h2>
                <button onclick="loadClients()" class="text-blue-600 text-sm">🔄 Оновити</button>
            </div>
            
            <div class="bg-white shadow rounded-lg overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Реєстрація</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Статус</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Дії</th>
                        </tr>
                    </thead>
                    <tbody id="clients-table" class="bg-white divide-y divide-gray-200">
                        </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // 1. CONFIG (Встав сюди свої дані з Firebase Console -> Project Settings)
         const firebaseConfig = {
    apiKey: "AIzaSyDBUbYLkuMMQaKHomNursjJ1zoFNtIZjy4",
    authDomain: "vdfy-auth-system.firebaseapp.com",
    projectId: "vdfy-auth-system",
    storageBucket: "vdfy-auth-system.firebasestorage.app",
    messagingSenderId: "381929137400",
    appId: "1:381929137400:web:661c3b07907e639fa5070d"
  };
        firebase.initializeApp(firebaseConfig);

        // Перевірка адміна
        firebase.auth().onAuthStateChanged(async user => {
            if (!user) return window.location.href = '/dashboard'; // Якщо не ввійшов
            
            const token = await user.getIdTokenResult();
            // Тут проста перевірка на email, сервер перевірить надійніше
            document.getElementById('admin-email').innerText = user.email;
            
            // Завантажуємо дані
            loadVideos();
            loadClients();
        });

        async function logout() {
            await firebase.auth().signOut();
            window.location.href = '/dashboard';
        }

        // --- TABS LOGIC ---
        function switchTab(tab) {
            document.getElementById('view-videos').classList.add('hidden');
            document.getElementById('view-clients').classList.add('hidden');
            document.getElementById('tab-videos').classList.remove('active-tab');
            document.getElementById('tab-clients').classList.remove('active-tab');

            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.add('active-tab');
        }

        // --- CLIENTS LOGIC ---
        async function loadClients() {
            const user = firebase.auth().currentUser;
            if (!user) return;
            const token = await user.getIdToken();

            try {
                const res = await fetch('/api/admin/users', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                const tbody = document.getElementById('clients-table');
                tbody.innerHTML = '';

                data.users.forEach(u => {
                    const createdDate = new Date(u.creationTime).toLocaleDateString();
                    const isBlocked = u.disabled;
                    
                    const statusBadge = isBlocked 
                        ? `<span class="px-2 py-1 text-xs rounded bg-red-100 text-red-800">Заблокований</span>`
                        : `<span class="px-2 py-1 text-xs rounded bg-green-100 text-green-800">Активний</span>`;

                    const btnBlock = isBlocked
                        ? `<button onclick="toggleUser('${u.uid}', false)" class="text-green-600 hover:text-green-900 mr-3">Розблокувати</button>`
                        : `<button onclick="toggleUser('${u.uid}', true)" class="text-orange-600 hover:text-orange-900 mr-3">Заблокувати</button>`;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${u.email}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${createdDate}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${statusBadge}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            ${btnBlock}
                            <button onclick="deleteUser('${u.uid}')" class="text-red-600 hover:text-red-900 font-bold">Видалити</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (e) {
                console.error(e);
                alert("Помилка завантаження клієнтів");
            }
        }

        async function toggleUser(uid, shouldBlock) {
            if(!confirm(shouldBlock ? "Заблокувати користувача?" : "Розблокувати користувача?")) return;
            
            const user = firebase.auth().currentUser;
            const token = await user.getIdToken();

            await fetch('/api/admin/toggle-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ uid, disabled: shouldBlock })
            });
            loadClients();
        }

        async function deleteUser(uid) {
            if(!confirm("⚠️ ВИДАЛИТИ КОРИСТУВАЧА НАЗАВЖДИ?\nЦю дію не можна скасувати.")) return;
            
            const user = firebase.auth().currentUser;
            const token = await user.getIdToken();

            await fetch('/api/admin/delete-user', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ uid })
            });
            loadClients();
        }

        // --- VIDEOS LOGIC (Стара логіка) ---
        async function loadVideos() {
            const user = firebase.auth().currentUser;
            const token = await user.getIdToken();
            const res = await fetch('/api/my-videos', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            const container = document.getElementById('video-list');
            container.innerHTML = '';
            
            data.videos.forEach(vid => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded shadow border";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                         <div>
                            <span class="text-xs font-bold text-blue-600 uppercase">${vid.owner}</span>
                            <h3 class="font-bold text-gray-800">${vid.formName}</h3>
                        </div>
                        <a href="${vid.url}" target="_blank" class="text-blue-500 text-sm underline">Link</a>
                    </div>
                    <video src="${vid.url}" controls class="w-full h-40 object-cover rounded bg-black mb-2"></video>
                    <div class="text-xs text-gray-500">${new Date(vid.uploadedAt).toLocaleString()}</div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
