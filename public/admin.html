<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>VDFY Admin - Restricted Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <style>
        .active-tab { border-bottom: 2px solid #2563eb; color: #2563eb; }
        details > summary { list-style: none; cursor: pointer; }
        details > summary::-webkit-details-marker { display: none; }
        
        /* Анімація появи */
        details[open] summary ~ * { animation: sweep .3s ease-in-out; }
        @keyframes sweep {
            0%    {opacity: 0; transform: translateY(-5px)}
            100%  {opacity: 1; transform: translateY(0)}
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <div id="login-screen" class="flex flex-col items-center justify-center min-h-screen">
        <div class="bg-white p-8 rounded-lg shadow-lg w-96 border border-gray-200">
            <div class="flex justify-center mb-6">
                <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center text-white text-2xl font-bold">A</div>
            </div>
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Admin Access</h2>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="email" id="email" placeholder="Email" required class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                <input type="password" id="password" placeholder="Password" required class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                <div id="login-error" class="text-red-500 text-sm text-center hidden"></div>
                <button type="submit" id="login-btn" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition font-bold">Увійти</button>
            </form>
        </div>
    </div>

    <div id="admin-panel" class="hidden">
        <nav class="bg-white shadow px-6 py-4 flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-blue-600 rounded text-white flex items-center justify-center font-bold">V</div>
                <h1 class="text-xl font-bold text-gray-800">VDFY Control</h1>
            </div>
            <div class="flex gap-4 items-center">
                <span id="admin-display-email" class="text-gray-500 text-sm"></span>
                <button onclick="logout()" class="bg-red-50 text-red-600 border border-red-200 px-4 py-1 rounded hover:bg-red-100 text-sm font-bold">Вихід</button>
            </div>
        </nav>

        <div class="max-w-7xl mx-auto mt-6 px-6 border-b border-gray-300 flex gap-8">
            <button onclick="switchTab('videos')" id="tab-videos" class="pb-3 px-2 font-medium text-gray-500 active-tab flex items-center gap-2">📂 Папки користувачів</button>
            <button onclick="switchTab('clients')" id="tab-clients" class="pb-3 px-2 font-medium text-gray-500 hover:text-gray-700 flex items-center gap-2">👥 База клієнтів</button>
        </div>

        <div class="max-w-7xl mx-auto p-6">
            <div id="view-videos">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold text-gray-700">Структура файлів</h2>
                    <button onclick="loadVideos()" class="text-blue-600 text-sm hover:underline">🔄 Оновити дані</button>
                </div>
                <div id="folders-container" class="space-y-4">
                    <p class="text-gray-400">Завантаження...</p>
                </div>
            </div>

            <div id="view-clients" class="hidden">
                <div class="bg-white shadow rounded-lg overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">Користувач</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">Дата</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">Статус</th>
                                <th class="px-6 py-3 text-right text-xs font-bold text-gray-500 uppercase">Дії</th>
                            </tr>
                        </thead>
                        <tbody id="clients-table" class="bg-white divide-y divide-gray-200"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 👇👇👇 КОНФІГ 👇👇👇
         const firebaseConfig = {
            apiKey: "AIzaSyDBUbYLkuMMQaKHomNursjJ1zoFNtIZjy4",
            authDomain: "vdfy-auth-system.firebaseapp.com",
            projectId: "vdfy-auth-system",
            storageBucket: "vdfy-auth-system.firebasestorage.app",
            messagingSenderId: "381929137400",
            appId: "1:381929137400:web:661c33b07907e639fa5070d"
        };
        // 👆👆👆

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const ADMIN_EMAIL = "simonenkoyaroslav2008@gmail.com"; 

        auth.onAuthStateChanged(user => {
            if (user && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                showAdminPanel(user);
            } else {
                showLoginScreen();
                if (user) {
                    console.warn("Unauthorized:", user.email);
                    auth.signOut();
                }
            }
        });

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            const err = document.getElementById('login-error');

            btn.innerText = "Checking...";
            err.classList.add('hidden');

            try {
                if (email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) throw new Error("Access Denied");
                await auth.signInWithEmailAndPassword(email, password);
            } catch (error) {
                err.innerText = "Error: " + error.message;
                err.classList.remove('hidden');
                btn.innerText = "Увійти";
            }
        }

        function showAdminPanel(user) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
            document.getElementById('admin-display-email').innerText = user.email;
            loadVideos(); 
            loadClients();
        }

        function showLoginScreen() {
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        async function logout() {
            await auth.signOut();
            window.location.reload();
        }

        // 🔥🔥🔥 ОНОВЛЕНА ЛОГІКА ЗГОРТАННЯ 🔥🔥🔥
        async function loadVideos() {
            const token = await auth.currentUser.getIdToken();
            const res = await fetch('/api/my-videos', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            
            const structuredData = {};
            data.videos.forEach(vid => {
                const owner = vid.owner;
                const formName = vid.formName || "General";
                if (!structuredData[owner]) structuredData[owner] = {};
                if (!structuredData[owner][formName]) structuredData[owner][formName] = [];
                structuredData[owner][formName].push(vid);
            });

            const container = document.getElementById('folders-container');
            container.innerHTML = '';

            Object.keys(structuredData).forEach(owner => {
                const userFolders = structuredData[owner];
                const totalVideos = Object.values(userFolders).flat().length;

                // 1. ГОЛОВНИЙ КОНТЕЙНЕР (ЮЗЕР)
                const userDetails = document.createElement('details');
                userDetails.className = "bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden group mb-4";
                
                let contentHTML = `
                    <summary class="flex items-center justify-between p-4 bg-white hover:bg-gray-50 transition select-none cursor-pointer">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl">👤</span>
                            <div>
                                <h3 class="font-bold text-gray-800 text-sm md:text-base">${owner}</h3>
                                <p class="text-xs text-gray-500">Відео: ${totalVideos}</p>
                            </div>
                        </div>
                        <span class="text-gray-400 transform group-open:rotate-180 transition">▼</span>
                    </summary>
                    <div class="p-4 bg-gray-50 space-y-3 border-t border-gray-100">
                `;

                // 2. ВНУТРІШНІ КОНТЕЙНЕРИ (ПАПКИ)
                Object.keys(userFolders).forEach(folderName => {
                    const videos = userFolders[folderName];

                    // Додаємо class="group/folder" для вкладеної анімації стрілочки
                    contentHTML += `
                        <details class="border border-blue-200 rounded-md bg-white overflow-hidden shadow-sm group/folder">
                            <summary class="bg-blue-50 px-4 py-3 border-b border-blue-100 flex items-center justify-between cursor-pointer select-none hover:bg-blue-100 transition">
                                <div class="flex items-center gap-2">
                                    <span class="text-lg">📁</span>
                                    <span class="font-bold text-blue-800 text-sm">${folderName}</span>
                                    <span class="text-xs text-blue-500 bg-white px-2 py-0.5 rounded-full border border-blue-200 shadow-sm">${videos.length}</span>
                                </div>
                                <span class="text-blue-400 text-xs transform group-open/folder:rotate-180 transition duration-200">▼</span>
                            </summary>
                            
                            <div class="p-3 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 bg-white">
                    `;

                    videos.forEach(vid => {
                        contentHTML += `
                            <div class="bg-gray-50 p-2 rounded border border-gray-200 shadow-sm relative hover:shadow-md transition">
                                <div class="flex justify-between mb-1 items-center">
                                    <span class="text-[10px] text-gray-400">${new Date(vid.uploadedAt).toLocaleDateString()}</span>
                                    <a href="${vid.url}" target="_blank" class="text-blue-500 text-xs hover:underline font-bold">Open ↗</a>
                                </div>
                                <video src="${vid.url}" controls class="w-full h-24 bg-black rounded object-cover mb-2"></video>
                                <button onclick="deleteVideo('${vid.key}')" class="w-full text-center text-xs text-red-500 hover:text-white hover:bg-red-500 border border-red-200 py-1 rounded transition">🗑 Видалити</button>
                            </div>
                        `;
                    });

                    contentHTML += `
                            </div>
                        </details>
                    `;
                });

                contentHTML += `</div>`;
                userDetails.innerHTML = contentHTML;
                container.appendChild(userDetails);
            });
        }

        async function deleteVideo(key) {
            if(!confirm("Видалити відео?")) return;
            const token = await auth.currentUser.getIdToken();
            await fetch('/api/delete-video', {
                 method: 'DELETE',
                 headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                 body: JSON.stringify({ videoKey: key })
            });
            loadVideos(); 
        }

        async function loadClients() {
            const token = await auth.currentUser.getIdToken();
            try {
                const res = await fetch('/api/admin/users', { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                const tbody = document.getElementById('clients-table');
                tbody.innerHTML = '';
                data.users.forEach(u => {
                    const isBlocked = u.disabled;
                    tbody.innerHTML += `
                        <tr>
                            <td class="px-6 py-4 text-sm font-medium text-gray-900">${u.email}</td>
                            <td class="px-6 py-4 text-sm text-gray-500">${new Date(u.creationTime).toLocaleDateString()}</td>
                            <td class="px-6 py-4 text-sm">${isBlocked ? '<span class="text-red-600 bg-red-100 px-2 rounded font-bold">BANNED</span>' : '<span class="text-green-600 bg-green-100 px-2 rounded font-bold">Active</span>'}</td>
                            <td class="px-6 py-4 text-right text-sm">
                                <button onclick="toggleUser('${u.uid}', ${!isBlocked})" class="${isBlocked ? "text-green-600" : "text-orange-600"} font-bold mr-4">${isBlocked ? "Розблокувати" : "Заблокувати"}</button>
                                <button onclick="deleteUser('${u.uid}')" class="text-red-600 font-bold">Видалити</button>
                            </td>
                        </tr>
                    `;
                });
            } catch(e) { console.error(e); }
        }

        async function toggleUser(uid, shouldBlock) {
            let reason = shouldBlock ? prompt("Причина:") : "";
            if (shouldBlock && reason === null) return;
            if (shouldBlock && !reason) reason = "Admin Decision";
            
            const token = await auth.currentUser.getIdToken();
            await fetch('/api/admin/toggle-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ uid, disabled: shouldBlock, reason })
            });
            loadClients();
        }

        async function deleteUser(uid) {
            if(!confirm("Delete User?")) return;
            const token = await auth.currentUser.getIdToken();
            await fetch('/api/admin/delete-user', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ uid })
            });
            loadClients();
        }

        function switchTab(tab) {
            document.getElementById('view-videos').classList.add('hidden');
            document.getElementById('view-clients').classList.add('hidden');
            document.getElementById('tab-videos').classList.remove('active-tab');
            document.getElementById('tab-clients').classList.remove('active-tab');
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.add('active-tab');
        }
    </script>
</body>
</html>
