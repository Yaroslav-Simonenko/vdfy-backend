<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VDFY Admin</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-width: 260px; max-width: 260px; height: 100vh; background: #212529; color: white; display: flex; flex-direction: column; position: fixed; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 12px 20px; display: block; border-radius: 6px; margin: 4px 10px; }
        .sidebar a:hover, .sidebar a.active { background: #0d6efd; color: white; }
        .content-wrapper { margin-left: 260px; padding: 30px; }
        [x-cloak] { display: none !important; }
    </style>
</head>

<body x-data="initApp()" x-cloak>

    <div x-show="isLoading" class="position-fixed top-0 start-0 w-100 h-100 bg-white d-flex justify-content-center align-items-center" style="z-index: 9999;">
        <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div x-show="!user && !isLoading" class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow p-5 text-center">
            <h1>🔐</h1>
            <h3>VDFY Admin</h3>
            <button @click="loginWithGoogle" class="btn btn-dark mt-3">Увійти через Google</button>
        </div>
    </div>

    <div x-show="user && !isLoading">
        <div class="sidebar">
            <div class="p-4 fs-4 fw-bold text-white border-bottom border-secondary">VDFY</div>
            <nav class="mt-3">
                <a href="#" @click.prevent="tab = 'dash'" :class="tab==='dash' ? 'active' : ''">Dashboard</a>
                <a href="#" @click.prevent="tab = 'media'" :class="tab==='media' ? 'active' : ''">Media</a>
            </nav>
            <div class="mt-auto p-3 border-top border-secondary">
                <small x-text="user?.email" class="d-block text-truncate mb-2 text-muted"></small>
                <button @click="logoutUser" class="btn btn-sm btn-outline-danger w-100">Вийти</button>
            </div>
        </div>

        <div class="content-wrapper">
            <div x-show="tab === 'dash'">
                <h2>Dashboard</h2>
                <div class="row mt-4">
                    <div class="col-md-4">
                        <div class="card p-3 shadow-sm">
                            <h5>Всього відео</h5>
                            <h2 x-text="videos.length">0</h2>
                        </div>
                    </div>
                </div>
            </div>

            <div x-show="tab === 'media'">
                <div class="d-flex justify-content-between mb-3">
                    <h2>Media Library</h2>
                    <button @click="fetchVideos" class="btn btn-sm btn-primary">🔄 Оновити</button>
                </div>
                
                <div class="row g-3">
                    <template x-for="video in videos" :key="video.key">
                        <div class="col-md-4">
                            <div class="card shadow-sm h-100">
                                <video :src="video.url" controls class="card-img-top bg-black" style="height: 200px; object-fit: contain;"></video>
                                <div class="card-body">
                                    <h6 x-text="video.formName || 'General'"></h6>
                                    <small class="text-muted" x-text="new Date(video.uploadedAt).toLocaleString()"></small>
                                    <button @click="deleteVid(video.key)" class="btn btn-sm btn-outline-danger w-100 mt-2">Видалити</button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Ця функція доступна завжди. Alpine знайде її 100%.
        function initApp() {
            return {
                user: null,
                isLoading: true,
                tab: 'dash',
                videos: [],

                // Функції-заглушки, які будуть замінені Firebase
                loginWithGoogle() { console.log("Firebase not ready"); },
                logoutUser() { console.log("Firebase not ready"); },
                fetchVideos() { console.log("Firebase not ready"); },
                deleteVid(key) { console.log("Delete", key); },

                // Цей метод викличеться, коли Firebase завантажиться
                setFirebaseActions(auth, provider, functions) {
                    this.loginWithGoogle = () => functions.signInWithPopup(auth, provider);
                    this.logoutUser = () => functions.signOut(auth);
                    
                    // Слідкуємо за юзером
                    functions.onAuthStateChanged(auth, (u) => {
                        this.user = u;
                        this.isLoading = false;
                        if (u) this.loadData(u);
                    });
                },

                async loadData(user) {
                    try {
                        const token = await user.getIdToken();
                        const res = await fetch('/api/my-videos', { headers: { 'Authorization': `Bearer ${token}` }});
                        const data = await res.json();
                        this.videos = data.videos || [];
                    } catch(e) { console.error(e); }
                },

                async deleteVid(key) {
                    if(!confirm("Видалити?")) return;
                    const token = await this.user.getIdToken();
                    await fetch('/api/delete-video', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ videoKey: key })
                    });
                    this.loadData(this.user);
                }
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // 👇👇👇 ТВОЇ КЛЮЧІ ТУТ 👇👇👇
        const firebaseConfig = {
            apiKey: "ВСТАВ_СЮДИ_KEY",
            authDomain: "...",
            projectId: "...",
            storageBucket: "...",
            messagingSenderId: "...",
            appId: "..."
        };

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const provider = new GoogleAuthProvider();

            // Чекаємо, поки Alpine завантажиться, і передаємо йому Firebase
            document.addEventListener('alpine:init', () => {
                // Магія: знаходимо компонент Alpine і даємо йому силу Firebase
                const root = document.querySelector('[x-data]');
                if(root && root._x_dataStack) {
                    root._x_dataStack[0].setFirebaseActions(auth, provider, { signInWithPopup, signOut, onAuthStateChanged });
                } else {
                    // Якщо Alpine ще спить, чекаємо секунду
                    setTimeout(() => {
                         const r = document.querySelector('[x-data]');
                         if(r) r._x_dataStack[0].setFirebaseActions(auth, provider, { signInWithPopup, signOut, onAuthStateChanged });
                    }, 500);
                }
            });
        } catch(e) {
            console.error("Firebase Error:", e);
        }
    </script>
</body>
</html>
