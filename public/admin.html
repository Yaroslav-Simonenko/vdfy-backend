<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>VDFY Admin - Full Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <style>
        .active-tab { border-bottom: 2px solid #2563eb; color: #2563eb; }
        body { background-color: #f3f4f6; }
    </style>
</head>
<body class="min-h-screen">

    <div id="login-screen" class="flex flex-col items-center justify-center min-h-screen">
        <div class="bg-white p-8 rounded-lg shadow-xl w-96">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Admin Access</h2>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="email" id="email" placeholder="Email" required class="w-full px-4 py-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                <input type="password" id="password" placeholder="Password" required class="w-full px-4 py-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                <button type="submit" id="login-btn" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 font-bold">Увійти</button>
            </form>
        </div>
    </div>

    <div id="admin-panel" class="hidden">
        <nav class="bg-white shadow px-6 py-4 flex justify-between items-center sticky top-0 z-50">
            <h1 class="text-xl font-bold text-gray-800">VDFY Admin</h1>
            <div class="flex gap-4 items-center">
                <span id="admin-display-email" class="text-gray-500 text-sm"></span>
                <button onclick="logout()" class="text-red-600 font-bold text-sm">Вихід</button>
            </div>
        </nav>

        <div class="max-w-7xl mx-auto mt-6 px-6 border-b border-gray-300 flex gap-8">
            <button onclick="switchTab('clients')" id="tab-clients" class="pb-3 px-2 font-medium text-gray-500 active-tab">👥 Клієнти</button>
            <button onclick="switchTab('videos')" id="tab-videos" class="pb-3 px-2 font-medium text-gray-500 hover:text-gray-700">📹 Відео</button>
        </div>

        <div class="max-w-7xl mx-auto p-6">
            
            <div id="view-clients">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold">Список користувачів</h2>
                    <button onclick="loadClients()" class="text-blue-600 text-sm">🔄 Оновити</button>
                </div>
                <div class="bg-white shadow rounded-lg overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">Email</th>
                                <th class="px-6 py-3 text-right text-xs font-bold text-gray-500 uppercase">Дії (Бан)</th>
                            </tr>
                        </thead>
                        <tbody id="clients-table" class="bg-white divide-y divide-gray-200"></tbody>
                    </table>
                </div>
            </div>

            <div id="view-videos" class="hidden">
                <h2 class="text-lg font-bold mb-4">Всі завантаження</h2>
                <div id="videos-container" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
            </div>

        </div>
    </div>

    <script>
        // 👇👇👇 ВСТАВ СЮДИ СВІЙ FIREBASE CONFIG 👇👇👇
         const firebaseConfig = {
    apiKey: "AIzaSyDBUbYLkuMMQaKHomNursjJ1zoFNtIZjy4",
    authDomain: "vdfy-auth-system.firebaseapp.com",
    projectId: "vdfy-auth-system",
    storageBucket: "vdfy-auth-system.firebasestorage.app",
    messagingSenderId: "381929137400",
    appId: "1:381929137400:web:661c3b07907e639fa5070d"
  };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const ADMIN_EMAIL = "simonenkoyaroslav2008@gmail.com"; 

        auth.onAuthStateChanged(user => {
            if (user && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                showAdminPanel(user);
            } else {
                showLoginScreen();
            }
        });

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if(email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) return alert("Немає доступу");

            try { await auth.signInWithEmailAndPassword(email, password); } 
            catch (e) { alert(e.message); }
        }

        function showAdminPanel(user) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
            document.getElementById('admin-display-email').innerText = user.email;
            loadClients();
            loadVideos();
        }

        function showLoginScreen() {
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        async function logout() { await auth.signOut(); location.reload(); }

        // --- ЛОГІКА КЛІЄНТІВ ---
        async function loadClients() {
            const token = await auth.currentUser.getIdToken();
            const res = await fetch('/api/admin/users', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            const tbody = document.getElementById('clients-table');
            tbody.innerHTML = '';

            data.users.forEach(u => {
                tbody.innerHTML += `
                    <tr>
                        <td class="px-6 py-4 text-sm font-medium text-gray-900">${u.email}</td>
                        <td class="px-6 py-4 text-right text-sm">
                            <button onclick="banUser('${u.uid}')" class="bg-red-500 text-white px-3 py-1 rounded font-bold text-xs mr-2 hover:bg-red-600">ЗАБАНИТИ</button>
                            <button onclick="unbanUser('${u.uid}')" class="bg-gray-200 text-gray-700 px-3 py-1 rounded font-bold text-xs hover:bg-gray-300">РОЗБАНИТИ</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function banUser(uid) {
            const reason = prompt("Вкажіть причину бану:", "Порушення правил");
            if(reason === null) return;
            const token = await auth.currentUser.getIdToken();
            await fetch('/api/admin/toggle-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ uid, disabled: true, reason })
            });
            alert("Забанено!");
        }

        async function unbanUser(uid) {
            if(!confirm("Розбанити?")) return;
            const token = await auth.currentUser.getIdToken();
            await fetch('/api/admin/toggle-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ uid, disabled: false })
            });
            alert("Розбанено!");
        }

        // --- ЛОГІКА ВІДЕО ---
        async function loadVideos() {
            const token = await auth.currentUser.getIdToken();
            const res = await fetch('/api/my-videos', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            const container = document.getElementById('videos-container');
            container.innerHTML = '';
            
            data.videos.forEach(v => {
                container.innerHTML += `
                    <div class="bg-white p-4 rounded shadow">
                        <div class="flex justify-between mb-2">
                            <span class="text-xs font-bold text-blue-600 truncate w-2/3">${v.owner}</span>
                            <button onclick="deleteVideo('${v.key}')" class="text-red-500 text-xs font-bold">ВИДАЛИТИ</button>
                        </div>
                        <video src="${v.url}" controls class="w-full h-32 bg-black rounded"></video>
                        <p class="text-xs text-gray-500 mt-2">${v.formName}</p>
                    </div>
                `;
            });
        }
        
        async function deleteVideo(key) {
            if(!confirm("Видалити?")) return;
            const token = await auth.currentUser.getIdToken();
            await fetch('/api/delete-video', {
                 method: 'DELETE',
                 headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                 body: JSON.stringify({ videoKey: key })
            });
            loadVideos();
        }

        function switchTab(tab) {
            document.getElementById('view-videos').classList.add('hidden');
            document.getElementById('view-clients').classList.add('hidden');
            document.getElementById('tab-videos').classList.remove('active-tab');
            document.getElementById('tab-clients').classList.remove('active-tab');

            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.add('active-tab');
        }
    </script>
</body>
</html>
