<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VDFY Admin - Debug</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <style>
        #fatal-error {
            display: none; 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #222; color: #ff4444; z-index: 99999; 
            padding: 20px; font-family: monospace; font-size: 18px;
        }
    </style>
</head>
<body class="bg-gray-50" x-data="appData()">

    <div id="fatal-error">
        <h1>💀 ЩОСЬ ПІШЛО НЕ ТАК</h1>
        <p>Скрипт зламався. Ось помилка:</p>
        <pre id="error-text">Завантаження...</pre>
    </div>

    <div x-show="!user" class="min-h-screen flex items-center justify-center bg-white">
        <div class="text-center p-10">
            <h1 class="text-4xl font-bold text-indigo-600 mb-4">VDFY Admin</h1>
            <button @click="login" class="bg-indigo-600 text-white px-8 py-3 rounded-lg font-bold hover:bg-indigo-700">
                Увійти через Google
            </button>
        </div>
    </div>

    <div x-show="user" style="display: none;" class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-white border-r p-4">
            <h2 class="font-bold text-xl mb-6 text-indigo-600">Панель</h2>
            <nav class="space-y-2">
                <button @click="currentTab='dashboard'" class="block w-full text-left p-2 rounded hover:bg-gray-100">Dashboard</button>
                <button @click="currentTab='media'" class="block w-full text-left p-2 rounded hover:bg-gray-100">Media</button>
            </nav>
            <div class="mt-10 border-t pt-4">
                <p x-text="user?.email" class="text-sm truncate"></p>
                <button @click="logout" class="text-red-500 text-sm">Вийти</button>
            </div>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <div x-show="currentTab === 'dashboard'">
                <h2 class="text-2xl font-bold mb-4">Dashboard</h2>
                <div class="bg-white p-6 rounded shadow">
                    Всього відео: <b x-text="stats.totalVideos"></b>
                </div>
            </div>
            
            <div x-show="currentTab === 'media'">
                <h2 class="text-2xl font-bold mb-4">Media</h2>
                <div class="grid grid-cols-3 gap-4">
                    <template x-for="(videos, name) in groupedVideos">
                        <div class="bg-white p-4 rounded shadow border cursor-pointer" @click="alert(name)">
                            <div class="text-3xl">📁</div>
                            <div x-text="name"></div>
                        </div>
                    </template>
                </div>
            </div>
        </main>
    </div>

    <script>
        window.onerror = function(msg, url, line) {
            document.getElementById('fatal-error').style.display = 'block';
            document.getElementById('error-text').innerText = `Error: ${msg}\nLine: ${line}`;
            return false;
        };
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // 👇👇👇 УВАЖНО ВСТАВ КЛЮЧІ ТУТ 👇👇👇
        const firebaseConfig = {
    apiKey: "AIzaSyDBUbYLkuMMQaKHomNursjJ1zoFNtIZjy4",
    authDomain: "vdfy-auth-system.firebaseapp.com",
    projectId: "vdfy-auth-system",
    storageBucket: "vdfy-auth-system.firebasestorage.app",
    messagingSenderId: "381929137400",
    appId: "1:381929137400:web:661c3b07907e639fa5070d"
  };

        let app, auth, provider;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            provider = new GoogleAuthProvider();
        } catch(e) {
            throw e; // Викидаємо помилку, щоб її спіймав window.onerror
        }

        document.addEventListener('alpine:init', () => {
            Alpine.data('appData', () => ({
                user: null,
                currentTab: 'dashboard',
                groupedVideos: {},
                stats: { totalVideos: 0 },

                init() {
                    onAuthStateChanged(auth, u => {
                        this.user = u;
                        if(u) this.loadData();
                    });
                },
                login() { signInWithPopup(auth, provider); },
                logout() { signOut(auth); },
                async loadData() {
                    if(!this.user) return;
                    try {
                        const token = await this.user.getIdToken();
                        const res = await fetch('/api/my-videos', { headers: { 'Authorization': `Bearer ${token}` } });
                        const data = await res.json();
                        // Спрощена логіка для тесту
                        this.groupedVideos = {};
                        let total = 0;
                        data.videos.forEach(v => {
                            const f = v.formName || "General";
                            if(!this.groupedVideos[f]) this.groupedVideos[f] = [];
                            this.groupedVideos[f].push(v);
                            total++;
                        });
                        this.stats.totalVideos = total;
                    } catch(e) { console.error(e); }
                }
            }));
        });
    </script>
</body>
</html>
