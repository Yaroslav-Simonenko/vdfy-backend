<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VDFY Admin</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-width: 260px; max-width: 260px; height: 100vh; background: #212529; color: white; display: flex; flex-direction: column; position: fixed; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 12px 20px; display: block; border-radius: 6px; margin: 4px 10px; }
        .sidebar a:hover, .sidebar a.active { background: #0d6efd; color: white; }
        .content-wrapper { margin-left: 260px; padding: 30px; }
        [x-cloak] { display: none !important; }
    </style>
</head>

<body x-data="initApp()" x-cloak>

    <div x-show="isLoading" class="position-fixed top-0 start-0 w-100 h-100 bg-white d-flex justify-content-center align-items-center" style="z-index: 9999;">
        <div class="text-center">
            <div class="spinner-border text-primary mb-3" role="status"></div>
            <div class="text-muted">Connecting to VDFY...</div>
        </div>
    </div>

    <div x-show="!user && !isLoading" class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow p-5 text-center" style="max-width: 400px; width: 100%;">
            <h1 class="mb-4">🔐</h1>
            <h3 class="mb-4">VDFY Admin</h3>
            <button @click="loginWithGoogle" class="btn btn-dark w-100 py-2">
                <i class="bi bi-google me-2"></i> Увійти через Google
            </button>
        </div>
    </div>

    <div x-show="user && !isLoading">
        <div class="sidebar">
            <div class="p-4 fs-4 fw-bold text-white border-bottom border-secondary">VDFY</div>
            <nav class="mt-3">
                <a href="#" @click.prevent="tab = 'dash'" :class="tab==='dash' ? 'active' : ''"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
                <a href="#" @click.prevent="tab = 'media'" :class="tab==='media' ? 'active' : ''"><i class="bi bi-collection-play me-2"></i> Media</a>
            </nav>
            <div class="mt-auto p-3 border-top border-secondary">
                <small x-text="user?.email" class="d-block text-truncate mb-2 text-muted"></small>
                <button @click="logoutUser" class="btn btn-sm btn-outline-danger w-100">Вийти</button>
            </div>
        </div>

        <div class="content-wrapper">
            <div x-show="tab === 'dash'">
                <h2>Dashboard</h2>
                <div class="row mt-4">
                    <div class="col-md-4">
                        <div class="card p-4 shadow-sm border-0 bg-primary text-white">
                            <h5>Всього відео</h5>
                            <h1 class="display-4 fw-bold" x-text="videos.length">0</h1>
                        </div>
                    </div>
                </div>
            </div>

            <div x-show="tab === 'media'">
                <div class="d-flex justify-content-between mb-4">
                    <h2>Media Library</h2>
                    <button @click="loadData(user)" class="btn btn-primary"><i class="bi bi-arrow-clockwise"></i> Оновити</button>
                </div>
                
                <div class="row g-4">
                    <template x-for="video in videos" :key="video.key">
                        <div class="col-md-4 col-lg-3">
                            <div class="card shadow-sm h-100 border-0">
                                <div class="ratio ratio-16x9 bg-black rounded-top">
                                    <video :src="video.url" controls class="object-fit-cover"></video>
                                </div>
                                <div class="card-body">
                                    <h6 class="card-title fw-bold" x-text="video.formName || 'General'"></h6>
                                    <p class="card-text small text-muted" x-text="new Date(video.uploadedAt).toLocaleString()"></p>
                                    <div class="d-grid gap-2">
                                        <button @click="deleteVid(video.key)" class="btn btn-sm btn-outline-danger">Видалити</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
                <div x-show="videos.length === 0" class="text-center text-muted py-5">
                    Список відео порожній.
                </div>
            </div>
        </div>
    </div>

    <script>
        function initApp() {
            return {
                user: null,
                isLoading: true,
                tab: 'dash',
                videos: [],

                init() {
                    // "Рукостискання": перевіряємо кожні 100мс, чи завантажився Firebase
                    const check = setInterval(() => {
                        if (window.firebaseReady) {
                            clearInterval(check);
                            console.log("🔥 Firebase Connected!");
                            
                            // Слухаємо вхід юзера
                            window.authObj.onAuthStateChanged(window.authInst, (u) => {
                                this.user = u;
                                this.isLoading = false;
                                if (u) this.loadData(u);
                            });
                        }
                    }, 100);
                },

                loginWithGoogle() { 
                    window.authObj.signInWithPopup(window.authInst, window.providerInst); 
                },
                
                logoutUser() { 
                    window.authObj.signOut(window.authInst); 
                },

                async loadData(user) {
                    try {
                        const token = await user.getIdToken();
                        const res = await fetch('/api/my-videos', { headers: { 'Authorization': `Bearer ${token}` }});
                        const data = await res.json();
                        this.videos = data.videos || [];
                    } catch(e) { console.error(e); }
                },

                async deleteVid(key) {
                    if(!confirm("Видалити це відео?")) return;
                    const token = await this.user.getIdToken();
                    await fetch('/api/delete-video', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ videoKey: key })
                    });
                    this.loadData(this.user);
                }
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // 👇👇👇 ТВОЇ КЛЮЧІ ТУТ 👇👇👇
        const firebaseConfig = {
    apiKey: "AIzaSyDBUbYLkuMMQaKHomNursjJ1zoFNtIZjy4",
    authDomain: "vdfy-auth-system.firebaseapp.com",
    projectId: "vdfy-auth-system",
    storageBucket: "vdfy-auth-system.firebasestorage.app",
    messagingSenderId: "381929137400",
    appId: "1:381929137400:web:661c3b07907e639fa5070d"
  };

        try {
            const app = initializeApp(firebaseConfig);
            // Експортуємо Firebase у глобальне вікно, щоб Alpine його побачив
            window.authInst = getAuth(app);
            window.providerInst = new GoogleAuthProvider();
            window.authObj = { signInWithPopup, signOut, onAuthStateChanged };
            
            // Сигнал, що все готово
            window.firebaseReady = true;
        } catch(e) {
            console.error("Firebase Init Error:", e);
        }
    </script>
</body>
</html>
