<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Video View</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f3f4f6; color: #1f2937; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 600px; width: 90%; text-align: center; }
        h2 { margin-top: 0; }
        .btn { background: #6366F1; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; margin-top: 20px; }
        .btn:hover { background: #4f46e5; }
        video { width: 100%; border-radius: 12px; margin-top: 20px; background: black; display: none; }
        .error { color: #ef4444; background: #fee2e2; padding: 10px; border-radius: 8px; margin-top: 20px; display: none; }
        .transcription { text-align: left; margin-top: 20px; background: #f9fafb; padding: 15px; border-radius: 8px; font-size: 14px; line-height: 1.5; display: none; border: 1px solid #e5e7eb; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #6366F1; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <div id="auth-section">
        <h2>🔒 Private Video Response</h2>
        <p>This video is protected. Please sign in to verify you are the form creator.</p>
        <button class="btn" onclick="signIn()">Sign in with Google</button>
    </div>

    <div id="loading" class="loader"></div>

    <div id="video-section" style="display: none;">
        <h2 id="video-title">📹 Candidate Response</h2>
        <video id="player" controls playsinline></video>
        <div id="transcription" class="transcription"></div>
    </div>

    <div id="error-msg" class="error"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // 🔴🔴🔴 СКОПІЮЙ СЮДИ КОНФІГ З DASHBOARD.HTML 🔴🔴🔴
    const firebaseConfig = {
    apiKey: "AIzaSyDBUbYLkuMMQaKHomNursjJ1zoFNtIZjy4",
    authDomain: "vdfy-auth-system.firebaseapp.com",
    projectId: "vdfy-auth-system",
    storageBucket: "vdfy-auth-system.firebasestorage.app",
    messagingSenderId: "381929137400",
    appId: "1:381929137400:web:661c3b07907e639fa5070d"
  };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // Отримуємо ID з URL (vdfy.org/v/ABCDE -> ABCDE)
    const videoId = window.location.pathname.split('/').pop();

    window.signIn = () => {
        signInWithPopup(auth, provider).catch(err => alert(err.message));
    };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            await loadVideo(user);
        }
    });

    async function loadVideo(user) {
        try {
            const token = await user.getIdToken();
            const res = await fetch(`/api/get-secure-video/${videoId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.status === 403) throw new Error("⛔ ACCESS DENIED: You are not the creator of this form.");
            if (res.status === 404) throw new Error("❌ Video not found.");
            if (!res.ok) throw new Error("Server Error");

            const data = await res.json();

            document.getElementById('loading').style.display = 'none';
            document.getElementById('video-section').style.display = 'block';
            
            const player = document.getElementById('player');
            player.src = data.url;
            player.style.display = 'block';

            if (data.transcription) {
                const transDiv = document.getElementById('transcription');
                transDiv.innerText = "📝 Transcription:\n" + data.transcription;
                transDiv.style.display = 'block';
            }

        } catch (e) {
            document.getElementById('loading').style.display = 'none';
            const errDiv = document.getElementById('error-msg');
            errDiv.innerText = e.message;
            errDiv.style.display = 'block';
        }
    }
</script>

</body>
</html>
